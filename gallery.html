<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Walk</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8ba87a;
    }
    body.inverted {
      filter: invert(1);
      transition: filter 0.4s ease;
    }
    body {
      transition: filter 0.4s ease;
    }
    #scroll-driver {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      z-index: 10;
      scrollbar-width: none;
      -ms-overflow-style: none;
      pointer-events: none;
    }
    #scroll-driver::-webkit-scrollbar {
      display: none;
    }
    #scroll-content {
      width: 100%;
      height: 30000px;
    }
    #scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #wall {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      will-change: transform;
    }
    .wall-frame {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transition: filter 0.35s ease, transform 0.35s ease;
    }
    .wall-frame.hovered {
      filter: drop-shadow(0 0 12px rgba(58, 107, 39, 0.45));
      transform: scale(1.015);
    }
    .wall-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(3px 4px 8px rgba(0,0,0,0.2));
    }

    /* Zoom overlay */
    #zoom-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #zoom-overlay.active {
      pointer-events: auto;
      opacity: 1;
    }
    body.inverted #zoom-backdrop {
      background: rgba(255, 255, 255, 0.65);
    }
    #zoom-backdrop {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #zoom-frame {
      position: absolute;
      transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.5));
    }
    #zoom-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .gallery-object {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }
    .gallery-object img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #character {
      position: fixed;
      bottom: 7.5vh;
      z-index: 7;
      will-change: left;
    }
    #character img {
      position: absolute;
      top: -100%;
      left: 0;
      width: 250%;
      height: 250%;
      object-fit: contain;
      opacity: 0;
    }
    #character img.active {
      opacity: 1;
    }
    #floor {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5.2vh;
      background: #ffffff;
      z-index: 0;
      pointer-events: none;
    }
    #floor-line {
      position: fixed;
      bottom: 5.2vh;
      left: 0;
      width: 100%;
      height: 0.45vh;
      background: rgb(0, 0, 0);
      z-index: 0;
      pointer-events: none;
    }
    /* ====== DOOR (inside wall, flipped horizontally) ====== */
    #wall-door {
      position: absolute;
      z-index: 11;
      cursor: pointer;
      pointer-events: auto;
      transform: scaleX(-1);
    }
    #wall-door img {
      position: absolute;
      left: 0;
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }
    #wall-door #gallery-door1 { bottom: 0; }
    #wall-door #gallery-door2-p2 { bottom: 4%; left: 29%; width: 90%; height: 90%; }

    /* Door front panel overlay — fixed, above character */
    #gallery-door-front-overlay {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      display: none;
      transform: scaleX(-1);
    }
    #gallery-door-front-overlay img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }

    /* Gallery polaroid above door */
    #gallery-polaroid {
      position: absolute;
      z-index: 11;
      pointer-events: auto;
      cursor: pointer;
      transition: filter 0.35s ease, transform 0.35s ease;
    }
    #gallery-polaroid.hovered {
      filter: drop-shadow(0 0 12px rgba(58, 107, 39, 0.45));
      transform: scale(1.015);
    }
    #gallery-polaroid img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }

    /* Lamp & plant overlay — fixed, above character */
    #lamp-plant-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 6;
      overflow: visible;
    }
    #lamp-plant-overlay img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }

    #vignette {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 6;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.12) 100%);
    }


    /* ── Gallery loading overlay ── */
    #gallery-loader {
      position: fixed;
      inset: 0;
      background: #8ba87a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: min(2.2vw, 2.2vh);
      transition: opacity 0.55s ease;
    }
    #gallery-loader.done {
      opacity: 0;
      pointer-events: none;
    }
    #gl-char {
      width: min(7vw, 7vh);
      animation: gl-spin 1.8s linear infinite;
    }
    #gl-char img { width: 100%; display: block; }
    @keyframes gl-spin {
      to { transform: rotate(360deg); }
    }
    #gl-label {
      font-family: 'Courier New', monospace;
      font-size: min(1.4vw, 1.4vh);
      color: #1a2e10;
      letter-spacing: 0.18em;
    }
    #gl-dots::after {
      content: '';
      animation: gl-dot 1.4s steps(4, end) infinite;
    }
    @keyframes gl-dot {
      0%  { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
    #gl-bar-wrap {
      width: min(22vw, 22vh);
      height: 0.3vh;
      background: rgba(0,0,0,0.15);
      border-radius: 99px;
      overflow: hidden;
    }
    #gl-bar-fill {
      height: 100%;
      width: 0%;
      background: #1a2e10;
      border-radius: 99px;
      transition: width 0.2s ease;
    }
    #gl-count {
      font-family: 'Courier New', monospace;
      font-size: min(0.9vw, 0.9vh);
      color: rgba(26,46,16,0.55);
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>
  <!-- Gallery loading overlay -->
  <div id="gallery-loader">
    <div id="gl-char"><img src="svgs/character/person_stand.svg" alt=""></div>
    <div id="gl-label">loading<span id="gl-dots"></span></div>
    <div id="gl-bar-wrap"><div id="gl-bar-fill"></div></div>
    <div id="gl-count">0 / 0</div>
  </div>

  <div id="scroll-driver">
    <div id="scroll-content"></div>
  </div>
  <div id="scene">
    <div id="wall"></div>
  </div>
  <div id="lamp-plant-overlay"></div>
  <div id="character">
    <img id="walkR1" src="svgs/gallery-character/walkright1.svg" alt="walk right 1" />
    <img id="walkR2" src="svgs/gallery-character/walkright2.svg" alt="walk right 2" />
    <img id="walkR3" src="svgs/gallery-character/walkright3.svg" alt="walk right 3" />
    <img id="walkR4" src="svgs/gallery-character/walkright4.svg" alt="walk right 4" />
    <img id="walkL1" src="svgs/gallery-character/walkleft1.svg" alt="walk left 1" />
    <img id="walkL2" src="svgs/gallery-character/walkleft2.svg" alt="walk left 2" />
    <img id="walkL3" src="svgs/gallery-character/walkleft3.svg" alt="walk left 3" />
    <img id="walkL4" src="svgs/gallery-character/walkleft4.svg" alt="walk left 4" />
    <img id="idleRight" src="svgs/gallery-character/idleright.svg" alt="idle facing right" class="active" />
    <img id="idleLeft" src="svgs/gallery-character/idleleft.svg" alt="idle facing left" />
  </div>
  <div id="floor"></div>
  <div id="floor-line"></div>
  <div id="gallery-door-front-overlay">
    <img src="svgs/office/door2-p1.svg" alt="open door front" />
  </div>
  <div id="vignette"></div>
  <canvas id="iris-overlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10000;opacity:0;"></canvas>

  <!-- Zoom overlay for painting close-up -->
  <div id="zoom-overlay">
    <div id="zoom-backdrop"></div>
    <div id="zoom-frame"></div>
  </div>

  <script>
    const BASE_VW = 1920;
    const BASE_VH = 1080;

    const frameLayout = [
      { id: 1,  x: 370,   y: 20,  w: 250, h: 250 },
      { id: 2,  x: 450,   y: 50, w: 250, h: 250 },
      { id: 3,  x: 700,   y: 4,  w: 250, h: 250 },
      { id: 4,  x: 750,   y: 35, w: 280, h: 280 },
      { id: 5,  x: 1050,  y: 8,  w: 250, h: 250 },
      { id: 6,  x: 1050,  y: 45, w: 250, h: 250 },
      { id: 7,  x: 1360,  y: 46,  w: 280, h: 280 },
      { id: 8,  x: 1780,  y: 4, w: 280, h: 280 },
      { id: 9,  x: 1380,  y: 9,  w: 350, h: 350 },
      { id: 10, x: 1700,  y: 48, w: 350, h: 350 },
      { id: 101, x: 2130,  y: -10, w: 1100, h: 1100 },
      { id: 11, x: 3300,  y: 4,  w: 250, h: 250 },
      { id: 12, x: 3440,  y: 30, w: 280, h: 280 },
      { id: 13, x: 3350,  y: 60,  w: 280, h: 280 },
      { id: 14, x: 3730,  y: 46, w: 350, h: 350 },
      { id: 15, x: 3870,  y: 8,  w: 330, h: 330 },
      { id: 16, x: 4200,  y: 40, w: 350, h: 350 },
      { id: 17, x: 4270,  y: 3,  w: 280, h: 280 },
      { id: 18, x: 4580,  y: 55, w: 280, h: 280 },
      { id: 19, x: 4920,  y: 57,  w: 250, h: 250 },
      { id: 20, x: 7000,  y: 32, w: 280, h: 280 },
      { id: 102, x: 4580,  y: -3,  w: 600, h: 600 },
      { id: 103, x: 5230,  y: -10,  w: 1100, h: 1100 },
      { id: 21, x: 6410,  y: 4,  w: 350, h: 350 },
      { id: 22, x: 6340,  y: 42, w: 320, h: 320 },
      { id: 23, x: 6700,  y: 44,  w: 280, h: 280 },
      { id: 24, x: 6800,  y: 5, w: 250, h: 250 },
      { id: 25, x: 7350,  y: 5,  w: 350, h: 350 },
      { id: 26, x: 7080,  y: 65,  w: 250, h: 250 },
      { id: 27, x: 7400,  y: 46, w: 280, h: 280 },
      { id: 104, x: 7760,  y: 36,  w: 600, h: 600 },
      { id: 28, x: 7740,  y: 8, w: 250, h: 250 },
      { id: 29, x: 8020,  y: 3,  w: 350, h: 350 },
      { id: 105, x: 8460,  y: 0,  w: 550, h: 550 },
      { id: 30, x: 8400,  y: 52, w: 280, h: 280 },
      { id: 31, x: 8725,  y: 52,  w: 280, h: 280 },
      { id: 32, x: 9080,  y: 4, w: 350, h: 350 },
      { id: 33, x: 9080,  y: 40,  w: 350, h: 350 },
    ];

    const WALL_BASE_WIDTH = 10300;
    const wallEl = document.getElementById('wall');

    function buildWall() {
      wallEl.innerHTML = '';
      const floorH = 0.05 * window.innerHeight;
      const s = (window.innerHeight - floorH) / (BASE_VH - 0.05 * BASE_VH);
      const wallWidth = WALL_BASE_WIDTH * s;
      wallEl.style.width = wallWidth + 'px';

      frameLayout.forEach(f => {
        const div = document.createElement('div');
        div.className = 'wall-frame';
        div.dataset.frameId = f.id;
        div.style.left = (f.x * s) + 'px';
        div.style.top = (f.y / 100 * BASE_VH * s) + 'px';
        div.style.width = (f.w * s) + 'px';
        div.style.height = (f.h * s) + 'px';
        const img = document.createElement('img');
        img.src = `svgs/gallery-frames/galleryframe${f.id}.svg`;
        img.alt = `gallery frame ${f.id}`;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'contain';
        div.appendChild(img);
        wallEl.appendChild(div);
      });

      // Floor line pixel position from top of wall
      const floorLineY = window.innerHeight - floorH;

      const lampFullH = 800 * s;
      const lampH = Math.min(lampFullH, (window.innerHeight - floorH) * 0.97);
      const lampW = 500 * s * (lampH / lampFullH);

      const lamp = document.createElement('div');
      lamp.className = 'gallery-object';
      lamp.style.left = (-10 * s) + 'px';
      lamp.style.top = (floorLineY - lampH + 20 * s) + 'px';
      lamp.style.width = lampW + 'px';
      lamp.style.height = lampH + 'px';
      lamp.style.zIndex = '6';
      lamp.innerHTML = '<img src="svgs/gallery-objects/gallerylamp1.svg" alt="lamp" />';
      wallEl.appendChild(lamp);

      const plant = document.createElement('div');
      plant.className = 'gallery-object';
      plant.style.left = (400 * s) + 'px';
      plant.style.top = (floorLineY - 140 * s + 20 * s) + 'px';
      plant.style.width = (110 * s) + 'px';
      plant.style.height = (140 * s) + 'px';
      plant.style.zIndex = '6';
      plant.innerHTML = '<img src="svgs/gallery-objects/galleryplant.svg" alt="plant" />';
      wallEl.appendChild(plant);

      // Intro text — below canvases, above floor, behind character
      const introText = document.createElement('div');
      introText.className = 'gallery-object';
      introText.style.left = (550 * s) + 'px';
      introText.style.top = (floorLineY - 80 * s) + 'px';
      introText.style.width = (1100 * s) + 'px';
      introText.style.height = (50 * s) + 'px';
      introText.style.zIndex = '1';
      introText.innerHTML = '<img src="svgs/gallery-objects/gallery-intro-text.svg" alt="intro text" />';
      wallEl.appendChild(introText);

      // Door (at right end of wall)
      const doorDiv = document.createElement('div');
      doorDiv.id = 'wall-door';
      const doorX = 9550;
      const doorH = 500;
      const doorW = 300;
      doorDiv.style.left = (doorX * s) + 'px';
      doorDiv.style.top = (floorLineY - doorH * s + 15 * s) + 'px';
      doorDiv.style.width = (doorW * s) + 'px';
      doorDiv.style.height = (doorH * s) + 'px';
      doorDiv.innerHTML = `
        <img id="gallery-door1" src="svgs/office/door1.svg" alt="closed door" />
        <img id="gallery-door2-p2" src="svgs/office/door2-p2.svg" alt="open door back" style="display:none;" />
      `;
      wallEl.appendChild(doorDiv);

      // Gallery text to the right of door
      const galleryText = document.createElement('div');
      galleryText.className = 'gallery-object';
      galleryText.style.left = ((doorX + 350) * s) + 'px';
      galleryText.style.top = (floorLineY - doorH * s - 50 * s) + 'px';
      galleryText.style.width = (300 * s) + 'px';
      galleryText.style.height = (300 * s) + 'px';
      galleryText.innerHTML = '<img src="svgs/gallery-objects/gallery-home-text.svg" alt="gallery text" />';
      wallEl.appendChild(galleryText);

      return wallWidth;
    }

    let wallWidth = buildWall();
    attachFrameClicks();

    // ── Gallery loading overlay ──
    // Track all frame imgs; hide overlay only when every one has loaded.
    (function() {
      const loader  = document.getElementById('gallery-loader');
      const barFill = document.getElementById('gl-bar-fill');
      const countEl = document.getElementById('gl-count');

      function trackFrames() {
        const imgs = wallEl.querySelectorAll('img');
        const total = imgs.length;
        if (total === 0) { loader.classList.add('done'); return; }
        countEl.textContent = '0%';
        let loaded = 0;

        function tick() {
          loaded++;
          const pct = loaded / total * 100;
          barFill.style.width = pct + '%';
          countEl.textContent = Math.round(pct) + '%';
          if (loaded >= total) {
            // Reveal scene and fade loader simultaneously
            document.getElementById('scene').style.opacity = '1';
            loader.classList.add('done');
            loader.addEventListener('transitionend', () => loader.remove(), { once: true });
            setTimeout(() => loader.remove(), 700);
          }
        }

        imgs.forEach(img => {
          if (img.complete) { tick(); }
          else { img.addEventListener('load', tick, { once: true });
                 img.addEventListener('error', tick, { once: true }); }
        });
      }
      trackFrames();
    })();

    const charEl = document.getElementById('character');
    let charWidth = 0;

    function sizeCharacter() {
      const floorH = 0.05 * window.innerHeight;
      const s = (window.innerHeight - floorH) / (BASE_VH - 0.05 * BASE_VH);
      charWidth = 80 * s;
      charEl.style.width = charWidth + 'px';
      charEl.style.height = (130 * s) + 'px';
    }
    sizeCharacter();

    // --- New movement system ---
    // characterX: pixel position of character on screen (from left)
    // wallOffset: how far the wall has scrolled (0 = start)
    // When moving right: character walks right across screen first.
    //   When character reaches RIGHT_EDGE, wall starts scrolling and character stays put.
    //   When wall reaches end, character continues walking right to screen edge.
    // When moving left: character walks left across screen first.
    //   When character reaches LEFT_EDGE, wall starts scrolling back and character stays put.
    //   When wall reaches 0, character continues walking left.

    const LEFT_EDGE = 0.05;    // 5% from left as fraction
    const RIGHT_EDGE = 0.70;   // 70% from left as fraction (where wall starts scrolling)

    let characterX = window.innerWidth * 0.30; // start at 30%
    let charXFrac = 0.30;  // character position as fraction of viewport width
    let wallOffset = 0;
    let wallOffsetFrac = 0;  // wall offset as fraction of max
    let MAX_WALL_OFFSET = Math.max(0, wallWidth - window.innerWidth);

    function getCharMinX() { return window.innerWidth * LEFT_EDGE; }
    function getCharMaxX() { return window.innerWidth - charWidth * 2.5; } // actual right edge of screen minus char
    function getCharScrollRightX() { return window.innerWidth * RIGHT_EDGE; } // where wall starts scrolling going right
    function getCharScrollLeftX() { return window.innerWidth * 0.30; } // where wall starts scrolling going left

    const lampPlantOverlay = document.getElementById('lamp-plant-overlay');
    let lampState = 1; // 1 or 2

    function toggleLamp() {
      lampState = lampState === 1 ? 2 : 1;
      // Update overlay lamp
      const oLamp = document.getElementById('overlay-lamp');
      if (oLamp) oLamp.querySelector('img').src = 'svgs/gallery-objects/gallerylamp' + lampState + '.svg';
      // Update wall lamp
      const wallLamp = wallEl.querySelector('.gallery-object img[alt="lamp"]');
      if (wallLamp) wallLamp.src = 'svgs/gallery-objects/gallerylamp' + lampState + '.svg';
      // Invert colors when lamp is off
      document.body.classList.toggle('inverted', lampState === 2);
    }

    function buildOverlay() {
      const floorH = 0.05 * window.innerHeight;
      const s = (window.innerHeight - floorH) / (BASE_VH - 0.05 * BASE_VH);
      const floorLineY = window.innerHeight - floorH;
      const lampFullH = 800 * s;
      const lampH = Math.min(lampFullH, (window.innerHeight - floorH) * 0.97);
      const lampW = 500 * s * (lampH / lampFullH);
      lampPlantOverlay.innerHTML = '';

      const oLamp = document.createElement('div');
      oLamp.id = 'overlay-lamp';
      oLamp.style.cssText = 'position:absolute; pointer-events:auto; cursor:pointer;';
      oLamp.dataset.baseLeft = (-10 * s);
      oLamp.style.top = (floorLineY - lampH + 20 * s) + 'px';
      oLamp.style.width = lampW + 'px';
      oLamp.style.height = lampH + 'px';
      oLamp.dataset.lampState = lampState;
      oLamp.innerHTML = '<img src="svgs/gallery-objects/gallerylamp' + lampState + '.svg" style="width:100%;height:100%;object-fit:contain;display:block;" />';
      oLamp.addEventListener('click', toggleLamp);
      lampPlantOverlay.appendChild(oLamp);

      const oPlant = document.createElement('div');
      oPlant.style.cssText = 'position:absolute; pointer-events:none;';
      oPlant.dataset.baseLeft = (400 * s);
      oPlant.style.top = (floorLineY - 140 * s + 20 * s) + 'px';
      oPlant.style.width = (110 * s) + 'px';
      oPlant.style.height = (140 * s) + 'px';
      oPlant.innerHTML = '<img src="svgs/gallery-objects/galleryplant.svg" style="width:100%;height:100%;object-fit:contain;display:block;" />';
      lampPlantOverlay.appendChild(oPlant);
    }
    buildOverlay();

    function updateOverlayPositions() {
      lampPlantOverlay.querySelectorAll('[data-base-left]').forEach(el => {
        el.style.left = (parseFloat(el.dataset.baseLeft) - wallOffset) + 'px';
      });
    }

    function applyPositions() {
      charXFrac = characterX / window.innerWidth;
      wallOffsetFrac = MAX_WALL_OFFSET > 0 ? wallOffset / MAX_WALL_OFFSET : 0;
      charEl.style.left = characterX + 'px';
      wallEl.style.transform = `translateX(${-wallOffset}px)`;
      updateOverlayPositions();
    }

    window.addEventListener('resize', () => {
      wallWidth = buildWall();
      buildOverlay();
      attachFrameClicks();
      sizeCharacter();
      MAX_WALL_OFFSET = Math.max(0, wallWidth - window.innerWidth);
      // Restore positions from fractions
      wallOffset = wallOffsetFrac * MAX_WALL_OFFSET;
      characterX = charXFrac * window.innerWidth;
      characterX = Math.max(getCharMinX(), Math.min(characterX, getCharMaxX()));
      applyPositions();
    });

    const walkRightFrames = [
      document.getElementById('walkR1'),
      document.getElementById('walkR2'),
      document.getElementById('walkR3'),
      document.getElementById('walkR4'),
    ];
    const walkLeftFrames = [
      document.getElementById('walkL1'),
      document.getElementById('walkL2'),
      document.getElementById('walkL3'),
      document.getElementById('walkL4'),
    ];
    const idleRight = document.getElementById('idleRight');
    const idleLeft = document.getElementById('idleLeft');
    const allFrames = [...walkRightFrames, ...walkLeftFrames, idleRight, idleLeft];

    let currentFrameIndex = 0;
    let lastDirection = 'right';
    let idleTimeout = null;
    let accumulatedDelta = 0;
    let keysHeld = { left: false, right: false };
    let keyAnimFrame = null;

    const WALK_SPEED = 8;
    const SCROLL_TO_WALK = 0.4;
    const FRAME_STEP = 80;
    const IDLE_DELAY = 250;

    function showFrame(frameEl) {
      allFrames.forEach(f => f.classList.remove('active'));
      frameEl.classList.add('active');
    }
    function showIdle() {
      showFrame(lastDirection === 'right' ? idleRight : idleLeft);
    }
    function advanceWalkFrame(direction) {
      const frames = direction === 'right' ? walkRightFrames : walkLeftFrames;
      lastDirection = direction;
      currentFrameIndex = (currentFrameIndex + 1) % 4;
      showFrame(frames[currentFrameIndex]);
      clearTimeout(idleTimeout);
      idleTimeout = setTimeout(showIdle, IDLE_DELAY);
    }

    let enteringDoor = false;

    function moveBy(deltaPx, force) {
      if (enteringDoor && !force) return;
      if (Math.abs(deltaPx) < 0.5) return;

      const direction = deltaPx > 0 ? 'right' : 'left';
      let remaining = deltaPx;

      if (direction === 'right') {
        // Phase 1: Move character to the scroll trigger point
        if (characterX < getCharScrollRightX()) {
          const charMove = Math.min(remaining, getCharScrollRightX() - characterX);
          characterX += charMove;
          remaining -= charMove;
        }

        // Phase 2: Scroll the wall
        if (remaining > 0 && wallOffset < MAX_WALL_OFFSET) {
          const wallMove = Math.min(remaining, MAX_WALL_OFFSET - wallOffset);
          wallOffset += wallMove;
          remaining -= wallMove;
        }

        // Phase 3: Wall is at end, character continues walking to right edge
        if (remaining > 0) {
          characterX = Math.min(characterX + remaining, getCharMaxX());
        }
      } else {
        // direction === 'left', deltaPx is negative
        remaining = Math.abs(remaining);

        // Phase 1: Move character left to the scroll trigger point
        if (characterX > getCharScrollLeftX()) {
          const charMove = Math.min(remaining, characterX - getCharScrollLeftX());
          characterX -= charMove;
          remaining -= charMove;
        }

        // Phase 2: Scroll the wall back
        if (remaining > 0 && wallOffset > 0) {
          const wallMove = Math.min(remaining, wallOffset);
          wallOffset -= wallMove;
          remaining -= wallMove;
        }

        // Phase 3: Wall is at start, character continues walking to left edge
        if (remaining > 0) {
          characterX = Math.max(characterX - remaining, getCharMinX());
        }
      }

      // Animate walk frames
      accumulatedDelta += Math.abs(deltaPx);
      if (accumulatedDelta >= FRAME_STEP) {
        advanceWalkFrame(direction);
        accumulatedDelta = accumulatedDelta % FRAME_STEP;
      }

      applyPositions();
    }

    // Use wheel event directly instead of scroll driver (since scroll-driver is pointer-events: none)
    let zoomedIn = false;

    document.addEventListener('wheel', (e) => {
      if (zoomedIn || enteringDoor) return;
      e.preventDefault();
      // Support both vertical and horizontal scrolling (trackpad sideways, shift+scroll, etc.)
      let delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (e.deltaMode === 1) delta *= 32;
      if (e.deltaMode === 2) delta *= window.innerHeight;
      moveBy(delta * SCROLL_TO_WALK);
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && zoomedIn) { closeZoom(); return; }
      if (zoomedIn) return;
      if (e.key === 'ArrowRight' || e.key === 'd') { keysHeld.right = true; e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'a') { keysHeld.left = true; e.preventDefault(); }
      startKeyLoop();
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') keysHeld.right = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keysHeld.left = false;
    });
    function startKeyLoop() { if (!keyAnimFrame) keyLoop(); }
    function keyLoop() {
      let delta = 0;
      if (keysHeld.right) delta += WALK_SPEED;
      if (keysHeld.left) delta -= WALK_SPEED;
      if (delta !== 0) { moveBy(delta); keyAnimFrame = requestAnimationFrame(keyLoop); }
      else keyAnimFrame = null;
    }

    let touchLastX = 0;
    document.addEventListener('touchstart', (e) => { if (!zoomedIn) touchLastX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (zoomedIn) return;
      const touchX = e.touches[0].clientX;
      moveBy((touchLastX - touchX) * 0.8);
      touchLastX = touchX;
    }, { passive: true });

    // --- Zoom / click-on-painting logic ---
    const zoomOverlay = document.getElementById('zoom-overlay');
    const zoomBackdrop = document.getElementById('zoom-backdrop');
    const zoomFrame = document.getElementById('zoom-frame');

    function openZoom(frameDiv) {
      zoomedIn = true;

      // Get the painting's current screen position
      const rect = frameDiv.getBoundingClientRect();
      const imgSrc = frameDiv.querySelector('img').src;

      // Set the zoom frame to start at the painting's current position
      zoomFrame.innerHTML = `<img src="${imgSrc}" alt="zoomed painting" />`;
      zoomFrame.style.left = rect.left + 'px';
      zoomFrame.style.top = rect.top + 'px';
      zoomFrame.style.width = rect.width + 'px';
      zoomFrame.style.height = rect.height + 'px';
      zoomFrame.style.transition = 'none';

      // Show overlay (backdrop fades in)
      zoomOverlay.classList.add('active');

      // Force reflow then animate to center
      zoomFrame.offsetHeight;

      // Calculate centered target size (fit within viewport)
      const frameId = parseInt(frameDiv.dataset.frameId);
      const isLargeFrame = (frameId === 101 || frameId === 103);
      const maxW = window.innerWidth * (isLargeFrame ? 0.92 : 0.75);
      const maxH = window.innerHeight * (isLargeFrame ? 0.95 : 0.80);
      const aspect = rect.width / rect.height;
      let targetW, targetH;
      if (aspect > maxW / maxH) {
        targetW = maxW;
        targetH = maxW / aspect;
      } else {
        targetH = maxH;
        targetW = maxH * aspect;
      }
      const targetX = (window.innerWidth - targetW) / 2;
      const targetY = (window.innerHeight - targetH) / 2;

      zoomFrame.style.transition = '';
      zoomFrame.style.left = targetX + 'px';
      zoomFrame.style.top = targetY + 'px';
      zoomFrame.style.width = targetW + 'px';
      zoomFrame.style.height = targetH + 'px';
    }

    function closeZoom() {
      if (!zoomedIn) return;
      zoomOverlay.classList.remove('active');
      zoomedIn = false;
    }

    // Close on backdrop click
    zoomBackdrop.addEventListener('click', closeZoom);
    zoomFrame.addEventListener('click', closeZoom);

    // Attach click and hover handlers to wall frames
    let lastHoveredFrame = null;

    function attachFrameClicks() {
      wallEl.querySelectorAll('.wall-frame').forEach(frame => {
        frame.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!zoomedIn) openZoom(frame);
        });
      });
    }

    // Hover: soft green glow matching index.html
    document.addEventListener('mousemove', (e) => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const found = el ? (el.closest('.wall-frame') || el.closest('#gallery-polaroid')) : null;

      if (found !== lastHoveredFrame) {
        if (lastHoveredFrame) lastHoveredFrame.classList.remove('hovered');
        if (found) found.classList.add('hovered');
        lastHoveredFrame = found;
      }
    });

    // ====== DOOR LOGIC ======
    const doorFrontOverlay = document.getElementById('gallery-door-front-overlay');

    function getDoorEl() { return document.getElementById('wall-door'); }
    function getDoor1() { return document.getElementById('gallery-door1'); }
    function getDoor2P2() { return document.getElementById('gallery-door2-p2'); }

    function getDoorCenterX() {
      const doorEl = getDoorEl();
      if (!doorEl) return 0;
      const rect = doorEl.getBoundingClientRect();
      return rect.left + rect.width / 2;
    }

    function showOpenDoor() {
      const door1 = getDoor1();
      const door2p2 = getDoor2P2();
      const doorEl = getDoorEl();
      if (!door1 || !door2p2 || !doorEl) return;

      door1.style.display = 'none';
      door2p2.style.display = 'block';

      // Position front overlay to match door's screen position
      const rect = doorEl.getBoundingClientRect();
      doorFrontOverlay.style.left = (rect.left + rect.width * -0.005) + 'px';
      doorFrontOverlay.style.top = (rect.top + rect.height * -0.03) + 'px';
      doorFrontOverlay.style.width = (rect.width * 1.1) + 'px';
      doorFrontOverlay.style.height = (rect.height * 1.07) + 'px';
      doorFrontOverlay.style.display = 'block';
    }

    function hideOpenDoor() {
      const door1 = getDoor1();
      const door2p2 = getDoor2P2();
      if (!door1 || !door2p2) return;

      door2p2.style.display = 'none';
      doorFrontOverlay.style.display = 'none';
      door1.style.display = 'block';
    }

    const irisCanvas = document.getElementById('iris-overlay');
    const irisCtx = irisCanvas.getContext('2d');

    function irisTransitionFromPoint(cx, cy, url) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      irisCanvas.width = w;
      irisCanvas.height = h;
      irisCanvas.style.opacity = '1';

      const maxR = Math.sqrt(Math.max(
        cx * cx + cy * cy,
        (w - cx) * (w - cx) + cy * cy,
        cx * cx + (h - cy) * (h - cy),
        (w - cx) * (w - cx) + (h - cy) * (h - cy)
      ));

      const duration = 1000;
      const start = performance.now();

      function draw(now) {
        const t = Math.min((now - start) / duration, 1);
        const ease = t * t;
        const r = maxR * (1 - ease);
        const rotation = t * Math.PI * 6;

        irisCtx.clearRect(0, 0, w, h);
        irisCtx.fillStyle = '#ffffff';
        irisCtx.beginPath();
        irisCtx.rect(0, 0, w, h);
        irisCtx.arc(cx, cy, Math.max(r, 0), 0, Math.PI * 2, true);
        irisCtx.fill('evenodd');

        irisCtx.strokeStyle = '#000000';
        irisCtx.lineWidth = 5;
        const steps = 300;
        const totalAngle = Math.PI * 20;
        irisCtx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const frac = i / steps;
          const spiralR = Math.max(r, 0) + frac * (maxR * 1.3);
          const angle = rotation + frac * totalAngle;
          const x = cx + Math.cos(angle) * spiralR;
          const y = cy + Math.sin(angle) * spiralR;
          if (i === 0) irisCtx.moveTo(x, y);
          else irisCtx.lineTo(x, y);
        }
        irisCtx.stroke();

        irisCtx.strokeStyle = '#000000';
        irisCtx.lineWidth = 4;
        irisCtx.beginPath();
        irisCtx.arc(cx, cy, Math.max(r, 0), 0, Math.PI * 2);
        irisCtx.stroke();

        if (t < 0.99) requestAnimationFrame(draw);
        else window.location.href = url;
      }
      requestAnimationFrame(draw);
    }

    function triggerDoorSequence() {
      showOpenDoor();

      const doorCX = getDoorCenterX();
      const doorEl = getDoorEl();
      const doorRect = doorEl.getBoundingClientRect();
      const irisCx = doorRect.left + doorRect.width / 2;
      const irisCy = doorRect.top + doorRect.height / 2;

      charEl.style.transition = 'left 0.4s ease-in, opacity 0.3s ease-in 0.1s';
      charEl.style.left = doorCX + 'px';
      charEl.style.opacity = '0';

      setTimeout(() => {
        hideOpenDoor();
        irisTransitionFromPoint(irisCx, irisCy, 'home.html');
      }, 450);
    }

    function autoWalkToDoor() {
      enteringDoor = true;
      const walkSpeed = 8;

      // Check if character is to the right of (or past) the door — need to walk left first
      const doorCX = getDoorCenterX();
      const charCenter = characterX + charWidth / 2;

      if (charCenter > doorCX - charWidth * 1.5) {
        // Character is on/past the door — walk left first (door stays closed), then approach from left
        hideOpenDoor();
        function walkLeftStep() {
          // Recalculate door position each frame since wall scrolls
          const currentDoorCX = getDoorCenterX();
          const targetX = currentDoorCX - charWidth * 5;
          if (characterX <= targetX) {
            showOpenDoor();
            walkRightIntoDoor();
            return;
          }
          moveBy(-walkSpeed, true);
          requestAnimationFrame(walkLeftStep);
        }
        walkLeftStep();
      } else {
        walkRightIntoDoor();
      }
    }

    function walkRightIntoDoor() {
      const walkSpeed = 8;

      function walkStep() {
        const doorCX = getDoorCenterX();
        const charRight = characterX + charWidth;

        if (charRight >= doorCX - charWidth * 1.2) {
          triggerDoorSequence();
          return;
        }

        // Move character right toward door
        moveBy(walkSpeed, true);
        // Update open door overlay position as wall scrolls
        showOpenDoor();
        requestAnimationFrame(walkStep);
      }
      walkStep();
    }

    // Polaroid click handler (event delegation since rebuilt in buildWall)
    wallEl.addEventListener('click', (e) => {
      const polaroid = e.target.closest('#gallery-polaroid');
      if (polaroid && !zoomedIn) {
        e.stopPropagation();
        openZoom(polaroid);
        return;
      }

      const doorEl = e.target.closest('#wall-door');
      if (!doorEl || enteringDoor) return;
      e.stopPropagation();
      showOpenDoor();
      autoWalkToDoor();
    });

    // Initialize
    showIdle();
    applyPositions();
  </script>
<script>
document.addEventListener('keydown', function(e){
  if((e.metaKey || e.ctrlKey) && (e.key === '=' || e.key === '+' || e.key === '-' || e.key === '0')){
    e.preventDefault();
  }
});
document.addEventListener('wheel', function(e){
  if(e.metaKey || e.ctrlKey) e.preventDefault();
}, {passive: false});
</script>
