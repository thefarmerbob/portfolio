<tspan x="91" dy="0">Developed in collaboration with LATAM chapter,</tspan>
<tspan x="91" dy="5.5">an NLP-powered system that automatically classifies</tspan>
<tspan x="91" dy="5.5">South American legal and regulatory documents across</tspan>
<tspan x="91" dy="5.5">10 countries. Led a team of 4 to design 26 LLM agent</tspan>
<tspan x="91" dy="5.5">prompts that analyze document status and disposition</tspan>
<tspan x="91" dy="5.5">— reducing analysis time from 2+ hours to 8 minutes</tspan>
<tspan x="91" dy="5.5">per document. Includes PDF parsing, per-page evidence</tspan>
<tspan x="91" dy="5.5">extraction, and batch spreadsheet export.</tspan>
</text></svg>