<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mara Buşirku — Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #8ba87a;
    }
    body {
      transition: filter 0.4s ease;
    }
    body.inverted {
      filter: invert(1);
    }
    body.inverted #zoom-backdrop,
    body.inverted #resume-backdrop {
      background: rgba(255, 255, 255, 0.65);
    }

    /* ====== SCROLL DRIVER ====== */
    #scroll-driver {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow-y: scroll; z-index: 10;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    #scroll-driver::-webkit-scrollbar { display: none; }
    #scroll-content { width: 100%; height: 8000px; }

    /* ====== SCENE & WALL ====== */
    #scene {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
      overflow: visible;
    }
    #wall {
      position: absolute; top: 0; left: 0;
      width: 100%; will-change: transform;
    }
    .wall-item { position: absolute; }
    .wall-item img { display: block; width: 100%; height: auto; }

    .wall-item.clickable,
    .wall-item.flippable {
      pointer-events: auto; cursor: pointer;
      transition: filter 0.35s ease, transform 0.35s ease;
    }
    .wall-item.clickable.hovered,
    .wall-item.flippable.hovered {
      filter: drop-shadow(0 0 12px rgba(58, 107, 39, 0.45));
      transform: scale(1.015);
    }


    .flip-container { position: relative; width: 100%; }
    .flip-front { position: relative; }
    .flip-front img { display: block; width: 100%; height: auto; }
    .flip-back { display: none; }

    /* ====== ZOOM OVERLAY ====== */
    #zoom-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      pointer-events: none; opacity: 0;
      transition: opacity 0.35s ease;
    }
    #zoom-overlay.active { pointer-events: auto; opacity: 1; }

    #zoom-backdrop {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #zoom-frame {
      position: absolute;
      perspective: 1200px;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.5));
      cursor: pointer;
    }
    #zoom-frame.animating {
      transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .zoom-flip-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }
    .zoom-flip-inner.can-flip {
      transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .zoom-flip-inner.flipped {
      transform: rotateY(180deg);
    }
    .zoom-flip-inner.flipped .zoom-face.front {
      pointer-events: none;
    }
    .zoom-face {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .zoom-face img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .zoom-face.back {
      transform: rotateY(180deg);
      pointer-events: auto;
    }
    .zoom-buttons {
      position: absolute;
      bottom: 21%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1vw;
      z-index: 10;
      pointer-events: auto;
    }
    .zoom-buttons a {
      display: block;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .zoom-buttons a:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }
    .zoom-buttons a:active {
      transform: scale(0.95);
    }
    .zoom-buttons a img {
      height: 2.6vw;
      width: auto;
      display: block;
    }
    .contact-links {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, 0);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5vh 3vh;
      z-index: 9999;
      pointer-events: auto;
    }
    .contact-links a {
      color: #3d3d3d;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2.4vh;
      font-weight: normal;
      text-decoration: underline;
      text-align: center;
      padding: 0.6vh 1.5vh;
      transition: color 0.2s;
      cursor: pointer;
    }
    .contact-links a:hover {
      color: #8ba87a;
    }

    /* ====== RESUME OVERLAY (IMPROVED) ====== */
    #resume-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0;
      transition: opacity 0.4s ease;
    }
    #resume-overlay.active { pointer-events: auto; opacity: 1; }

    #resume-backdrop {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #resume-wrapper {
      position: relative;
      z-index: 101;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: scale(0.92) translateY(12px);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    #resume-overlay.active #resume-wrapper {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    #resume-top-bar {
      width: min(62vh, 85vw);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    #resume-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #resume-close:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: scale(1.08);
    }

    #resume-popup {
      width: min(62vh, 85vw);
      height: min(82vh, 115vw);
      background: white;
      border-radius: 10px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45),
                  0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    #resume-popup embed {
      width: 100%; height: 100%; display: block;
    }

    #resume-bottom-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #resume-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 500;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #resume-download:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: translateY(-1px);
    }
    #resume-download svg {
      width: 14px; height: 14px;
      fill: currentColor;
    }

    /* ====== LADDER & CHARACTER ====== */
    #ladder-wrap {
      position: absolute; right: 4vw; top: 6vw;
      width: 14vw; will-change: transform;
    }
    .ladder-spacer { height: 20vw; }
    #ladder-wrap img.ladder-img { display: block; width: 70%; height: auto; }

    /* ====== FLOOR (scrolls with wall, positioned by JS at ladder bottom) ====== */
    #wall-floor-line {
      position: absolute;
      left: 0; width: 100%;
      background: #000;
      pointer-events: none;
      z-index: 10;
    }
    #wall-floor {
      position: absolute;
      left: 0; width: 100%;
      height: 50vh;
      background: #ffffff;
      pointer-events: none;
      z-index: 9;
    }

    /* ====== DOOR (scrolls with wall) ====== */
    #wall-door {
      position: absolute;
      left: 8vw;
      width: 16vw;
      z-index: 11;
      cursor: pointer;
      pointer-events: auto;
    }
    #wall-door img {
      position: absolute;
      left: 0;
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }
    #wall-door #door1 { bottom: -2.5vw; object-position: bottom center; }
    #wall-door #door2-p2 { bottom: -7%; left: 40%; width: 84%; height: 88%; object-position: bottom center; }

    /* Door front panel overlay — fixed, above character */
    #door-front-overlay {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      display: none;
    }
    #door-front-overlay img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }

    /* ====== CHARACTER ====== */
    #character {
      position: fixed; right: 5vw;
      width: 18vw; z-index: 5;
      will-change: top;
    }
    #character .climb-frame {
      position: absolute; top: 0; left: 25%;
      width: 55%; height: auto;
    }
    #character .climb-frame.hidden { opacity: 0; }
    #character .climb-frame.visible { opacity: 1; }

    /* Walk sprites (gallery-style sizing) */
    #character .walk-frame {
      position: absolute;
      top: -100%; left: 0;
      width: 250%; height: 250%;
      object-fit: contain;
      opacity: 0;
    }
    #character .walk-frame.visible { opacity: 1; }

    /* Walk mode overrides */
    #character.walking {
      right: auto;
      top: auto !important;
      bottom: 6.5vh;
    }
    #character.walking .climb-frame { display: none; }

    #vignette {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.12) 100%);
    }

    /* ====== LOADING SCREEN ====== */
    #loading-screen {
      position: fixed; inset: 0;
      background: #8ba87a;
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }
    #loading-screen.done { opacity: 0; pointer-events: none; }
    #loading-dot {
      width: 12px; height: 12px;
      background: #000; border-radius: 50%;
      animation: ldpulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes ldpulse {
      from { transform: scale(0.6); opacity: 0.4; }
      to   { transform: scale(1.4); opacity: 1; }
    }
  </style>
</head>

  <script>
    /* ============================================================
       SCROLL, WALL & LADDER
       ============================================================ */
    const scrollDriver = document.getElementById('scroll-driver');
    const wall         = document.getElementById('wall');
    const ladderWrap   = document.getElementById('ladder-wrap');
    const charEl       = document.getElementById('character');
    const wallFloorLine = document.getElementById('wall-floor-line');
    const wallFloor     = document.getElementById('wall-floor');
    const charFrame1   = document.getElementById('frame1');
    const charFrame2   = document.getElementById('frame2');
    const ladderImg    = document.querySelector('.ladder-img');

    /* ============================================================
       CHARACTER CLIMBING SYSTEM — LINEAR PROGRESS
       ============================================================ */
    const CHAR_START_TOP_FRAC = 0.40;
    const FRAME_STEP = 140;

    let totalInput = 0;        // accumulated scroll input (0 … totalRange)
    let characterScreenY = 0;
    let wallOffset = 0;
    let maxWallOffset = 0;
    let accumulatedDelta = 0;
    let currentFrame = 1;
    let hasReachedLadderBottom = false;

    /* --- Ladder geometry (recomputed on load/resize) --- */
    function getLadderBottomInWallSpace() {
      const vw = window.innerWidth / 100;
      const ladderStartY = 26 * vw;             // 6vw top + 20vw spacer
      const ladderRenderedW = 14 * 0.7 * vw;    // 9.8vw
      let ladderH;
      if (ladderImg && ladderImg.naturalWidth > 0) {
        ladderH = (ladderImg.naturalHeight / ladderImg.naturalWidth) * ladderRenderedW;
      } else {
        ladderH = 40 * vw;
      }
      return ladderStartY + ladderH;
    }

    function getClimbFeetOffset() {
      const vw = window.innerWidth / 100;
      const spriteW = 0.55 * 18 * vw;
      let spriteH;
      if (charFrame1.naturalWidth > 0) {
        spriteH = (charFrame1.naturalHeight / charFrame1.naturalWidth) * spriteW;
      } else {
        spriteH = spriteW * 2.5;
      }
      return spriteH;
    }

    /* --- Compute layout: start/end Y for character + maxWallOffset --- */
    function computeLayout() {
      const vw = window.innerWidth / 100;
      const vh = window.innerHeight;
      const ladderBottom = getLadderBottomInWallSpace();
      const feetOffset = getClimbFeetOffset();
      const startY = vh * CHAR_START_TOP_FRAC;

      // We need enough wall scroll to show all content
      const contentBottom = 140 * vw;  // approx lowest wall item
      const contentWO = Math.max(0, contentBottom - vh);

      // At end: ladder bottom on screen should be above the floor (floor = bottom 8%)
      // ladderBottom - maxWO should land at ~vh * 0.95 so ladder overlaps the floor
      const maxWO = Math.max(contentWO, ladderBottom - vh * 0.95);
      const endY = Math.max(startY, ladderBottom - feetOffset - maxWO);

      return { startY, endY, maxWO, ladderBottom, contentBottom };
    }

    function recalcAll() {
      const layout = computeLayout();
      maxWallOffset = layout.maxWO;
      document.getElementById('scroll-content').style.height =
        (maxWallOffset + window.innerHeight) + 'px';

      // Position floor at bottom of all wall content
      const vh = window.innerHeight;
      const floorTop = layout.maxWO + Math.min(vh * 0.95, layout.contentBottom + 10 * (vh / 100));

      // Position door — raised to compensate for SVG bottom whitespace (~7% of height)
      const doorH = window.innerWidth * 0.30;
      doorEl.style.height = doorH + 'px';
      doorEl.style.top = (floorTop - doorH * 0.07 - doorH) + 'px';

      // Floor line at natural position (independent of door)
      const floorLineH = 5 / window.devicePixelRatio;
      wallFloorLine.style.height = floorLineH + 'px';
      wallFloorLine.style.top = floorTop + 'px';
      wallFloor.style.top = (floorTop + floorLineH) + 'px';

      // Position door text next to door
      const doorText = document.getElementById('wall-door-text');
      doorText.style.top = (floorTop - doorH * 0.1 - doorH * 0.70) + 'px';
    }

    function applyFromInput() {
      const { startY, endY, maxWO } = computeLayout();
      const charRange = endY - startY;
      const totalRange = charRange + maxWO;
      totalInput = Math.max(0, Math.min(totalRange, totalInput));

      const t = totalRange > 0 ? totalInput / totalRange : 0;
      characterScreenY = startY + charRange * t;
      wallOffset = maxWO * t;

      wall.style.transform       = `translateY(${-wallOffset}px)`;
      ladderWrap.style.transform = `translateY(${-wallOffset}px)`;
      charEl.style.top           = characterScreenY + 'px';

      if (t >= 0.999) {
        if (!hasReachedLadderBottom) {
          hasReachedLadderBottom = true;
          enterWalkMode();
        }
      } else {
        if (hasReachedLadderBottom) {
          hasReachedLadderBottom = false;
          charFrame1.className = 'climb-frame ' + (currentFrame === 1 ? 'visible' : 'hidden');
          charFrame2.className = 'climb-frame ' + (currentFrame === 2 ? 'visible' : 'hidden');
        }
      }
    }

    function advanceClimbFrame() {
      const show1 = currentFrame !== 1;
      charFrame1.className = 'climb-frame ' + (show1 ? 'visible' : 'hidden');
      charFrame2.className = 'climb-frame ' + (show1 ? 'hidden'  : 'visible');
      currentFrame = show1 ? 1 : 2;
    }

    /* ============================================================
       MOVE FUNCTION — LINEAR PROGRESS
       ============================================================ */
    function moveBy(delta) {
      if (Math.abs(delta) < 0.5) return;

      if (mode === 'walk') {
        walkMoveBy(delta);
        return;
      }

      // At bottom and scrolling down — enter walk mode
      if (hasReachedLadderBottom && delta > 0) {
        enterWalkMode();
        return;
      }

      totalInput += delta;
      applyFromInput();

      // Animate climbing frames
      if (!hasReachedLadderBottom) {
        accumulatedDelta += Math.abs(delta);
        if (accumulatedDelta >= FRAME_STEP) {
          advanceClimbFrame();
          accumulatedDelta %= FRAME_STEP;
        }
      }
    }

    /* ============================================================
       WALK MODE — after reaching ladder bottom
       ============================================================ */
    const walkLeftFrames = [
      document.getElementById('walkL1'),
      document.getElementById('walkL2'),
      document.getElementById('walkL3'),
      document.getElementById('walkL4'),
    ];
    const walkRightFrames = [
      document.getElementById('walkR1'),
      document.getElementById('walkR2'),
      document.getElementById('walkR3'),
      document.getElementById('walkR4'),
    ];
    const idleLeftEl = document.getElementById('idleLeft');
    const idleRightEl = document.getElementById('idleRight');
    const allWalkFrames = [...walkLeftFrames, ...walkRightFrames, idleLeftEl, idleRightEl];
    const doorEl   = document.getElementById('wall-door');
    const door1Img = document.getElementById('door1');
    const door2P2  = document.getElementById('door2-p2');
    const doorFrontOverlay = document.getElementById('door-front-overlay');

    let mode = 'climb';  // 'climb' or 'walk'
    let enteringDoor = false;  // true when character is walking into door
    let walkX = 0;       // character left position in walk mode (pixels)
    let walkXFrac = 0;   // walkX as fraction of viewport width (for resize)
    let walkFrameIndex = 0;
    let walkIdleTimeout = null;
    const WALK_FRAME_STEP = 80;
    const WALK_IDLE_DELAY = 250;
    let walkAccDelta = 0;

    function getWalkCharSize() {
      const vw = window.innerWidth / 100;
      return { w: 5.5 * 0.7 * vw, h: 9 * 0.7 * vw };
    }

    function getLadderLeftX() {
      // Ladder is at right: 4vw, width: 14vw → left edge is at (100 - 4 - 14)vw = 82vw
      return window.innerWidth * 0.82;
    }

    function enterWalkMode() {
      mode = 'walk';
      const sz = getWalkCharSize();
      // Position character just to the left of the ladder
      walkX = getLadderLeftX() - sz.w;

      walkXFrac = walkX / window.innerWidth;

      charEl.classList.add('walking');
      charEl.style.width = sz.w + 'px';
      charEl.style.height = sz.h + 'px';
      charEl.style.left = walkX + 'px';
      charEl.style.top = '';

      charFrame1.className = 'climb-frame hidden';
      charFrame2.className = 'climb-frame hidden';
      showWalkFrame(idleLeftEl);
    }

    function exitWalkMode() {
      mode = 'climb';
      charEl.classList.remove('walking');
      charEl.style.width = '18vw';
      charEl.style.height = '';
      charEl.style.left = '';
      walkAccDelta = 0;
      clearTimeout(walkIdleTimeout);

      // Hide walk frames
      allWalkFrames.forEach(f => f.classList.remove('visible'));

      charFrame1.className = 'climb-frame ' + (currentFrame === 1 ? 'visible' : 'hidden');
      charFrame2.className = 'climb-frame ' + (currentFrame === 2 ? 'visible' : 'hidden');
      hasReachedLadderBottom = true;
    }

    function showWalkFrame(frameEl) {
      allWalkFrames.forEach(f => f.classList.remove('visible'));
      frameEl.classList.add('visible');
    }

    function showWalkIdle() {
      showWalkFrame(idleLeftEl);
    }

    function advanceWalkLeftFrame() {
      walkFrameIndex = (walkFrameIndex + 1) % 4;
      showWalkFrame(walkLeftFrames[walkFrameIndex]);
      clearTimeout(walkIdleTimeout);
      walkIdleTimeout = setTimeout(showWalkIdle, WALK_IDLE_DELAY);
    }

    function advanceWalkRightFrame() {
      walkFrameIndex = (walkFrameIndex + 1) % 4;
      showWalkFrame(walkRightFrames[walkFrameIndex]);
      clearTimeout(walkIdleTimeout);
      walkIdleTimeout = setTimeout(showWalkIdle, WALK_IDLE_DELAY);
    }

    function getDoorCenterX() {
      const vw = window.innerWidth / 100;
      return 8 * vw + doorEl.offsetWidth * 0.5;
    }

    function showOpenDoor() {
      door1Img.style.display = 'none';
      door2P2.style.display = 'block';

      // Position front overlay to match door's screen position
      const rect = doorEl.getBoundingClientRect();
      doorFrontOverlay.style.left = rect.left + 'px';
      doorFrontOverlay.style.top = (rect.top + rect.height * 0.18) + 'px';
      doorFrontOverlay.style.width = (rect.width * 1.02) + 'px';
      doorFrontOverlay.style.height = (rect.height * 1.02) + 'px';
      doorFrontOverlay.style.display = 'block';
    }

    function hideOpenDoor() {
      door2P2.style.display = 'none';
      doorFrontOverlay.style.display = 'none';
      door1Img.style.display = 'block';
    }

    function triggerDoorSequence() {
      showOpenDoor();

      const doorCX = getDoorCenterX();
      const sz = getWalkCharSize();
      const targetX = doorCX;

      const doorRect = doorEl.getBoundingClientRect();
      const irisCx = doorRect.left + doorRect.width / 2;
      const irisCy = doorRect.top + doorRect.height / 2;

      charEl.style.transition = 'left 0.15s ease-in, opacity 0.1s ease-in 0.05s';
      charEl.style.left = targetX + 'px';
      charEl.style.opacity = '0';

      setTimeout(() => {
        hideOpenDoor();
        irisTransitionFromPoint(irisCx, irisCy, 'home.html');
      }, 200);
    }

    function walkMoveBy(delta) {
      if (enteringDoor) return;

      // delta > 0 means scroll down = walk left
      if (delta > 0) {
        const sz = getWalkCharSize();
        const minX = getDoorCenterX() + sz.w * -3.8;
        walkX = Math.max(minX, walkX - delta);
        walkXFrac = walkX / window.innerWidth;
        charEl.style.left = walkX + 'px';

        walkAccDelta += Math.abs(delta);
        if (walkAccDelta >= WALK_FRAME_STEP) {
          advanceWalkLeftFrame();
          walkAccDelta %= WALK_FRAME_STEP;
        }

      } else {
        // Scrolling up = walk right, back toward ladder
        const sz = getWalkCharSize();
        const maxX = getLadderLeftX() - sz.w;
        walkX = Math.min(maxX, walkX - delta);
        if (walkX >= maxX) {
          walkX = maxX;
          exitWalkMode();
          return;
        }
        walkXFrac = walkX / window.innerWidth;
        charEl.style.left = walkX + 'px';

        walkAccDelta += Math.abs(delta);
        if (walkAccDelta >= WALK_FRAME_STEP) {
          advanceWalkLeftFrame();
          walkAccDelta %= WALK_FRAME_STEP;
        }
      }
    }

    /* ============================================================
       INPUT: Wheel / Touch / Keyboard
       ============================================================ */
    scrollDriver.style.pointerEvents = 'none';
    scrollDriver.style.overflow = 'hidden';

    const SCROLL_TO_MOVE = 0.8;

    document.addEventListener('wheel', (e) => {
      if (zoomedIn || resumeOverlay.classList.contains('active')) return;
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      moveBy(delta * SCROLL_TO_MOVE);
    }, { passive: false });

    let touchLastY = 0;
    document.addEventListener('touchstart', (e) => {
      if (!zoomedIn && !resumeOverlay.classList.contains('active')) {
        touchLastY = e.touches[0].clientY;
      }
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (zoomedIn || resumeOverlay.classList.contains('active')) return;
      const touchY = e.touches[0].clientY;
      moveBy((touchLastY - touchY) * 0.8);
      touchLastY = touchY;
    }, { passive: false });

    let keysHeld = { up: false, down: false };
    let keyAnimFrame = null;
    const KEY_SPEED = 8;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (zoomedIn) closeZoom();
        else if (resumeOverlay.classList.contains('active')) closeResume();
        return;
      }
      if (zoomedIn || resumeOverlay.classList.contains('active')) return;
      if (e.key === 'ArrowDown' || e.key === 's') { keysHeld.down = true; e.preventDefault(); }
      if (e.key === 'ArrowUp' || e.key === 'w') { keysHeld.up = true; e.preventDefault(); }
      startKeyLoop();
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowDown' || e.key === 's') keysHeld.down = false;
      if (e.key === 'ArrowUp' || e.key === 'w') keysHeld.up = false;
    });
    function startKeyLoop() { if (!keyAnimFrame) keyLoop(); }
    function keyLoop() {
      let delta = 0;
      if (keysHeld.down) delta += KEY_SPEED;
      if (keysHeld.up) delta -= KEY_SPEED;
      if (delta !== 0) { moveBy(delta); keyAnimFrame = requestAnimationFrame(keyLoop); }
      else keyAnimFrame = null;
    }

    /* ============================================================
       FLIP CONTAINER HEIGHT
       ============================================================ */
    document.querySelectorAll('.wall-item.flippable').forEach(item => {
      const img = item.querySelector('.flip-front img');
      const ct  = item.querySelector('.flip-container');
      const fn  = () => { if (img.naturalHeight) ct.style.height = (item.offsetWidth * img.naturalHeight / img.naturalWidth) + 'px'; };
      img.addEventListener('load', fn);
      window.addEventListener('resize', fn);
      if (img.complete) fn();
    });

    /* ============================================================
       ZOOM + FLIP OVERLAY
       ============================================================ */
    const zoomOverlay  = document.getElementById('zoom-overlay');
    const zoomBackdrop = document.getElementById('zoom-backdrop');
    const zoomFrame    = document.getElementById('zoom-frame');

    let zoomedIn = false;
    let flipTimer = null;

    const frameButtons = {
      'officeframe5back': {
        project: 'https://drive.google.com/drive/folders/1vk_DT_p7rFQZBBHtEuTzWQ314RAnSs8W?usp=sharing',
        code: 'https://github.com/thefarmerbob/Microplastic-Prediction.git',
        buttonBottom: '25%'
      },
      'officeframe6back': {
        project: 'https://hermex-frontend.vercel.app/',
        code: 'https://github.com/Ahm3dGI1/hermex.git',
        buttonBottom: '28%'
      },
      'officeframe7back': {
        code: 'https://github.com/thefarmerbob/sncrmt3web.git',
        buttonBottom: '21%'
      },
      'officeframe8back': {
        project: 'https://ai-taxonomy-dnyq.vercel.app/',
        code: 'https://github.com/thefarmerbob/AI-Taxonomy.git',
        buttonBottom: '25%'
      },
      'officeframe9back': {
        code: 'https://github.com/thefarmerbob/OpenMLC-Matlab-2.git',
        buttonBottom: '25%'
      },
      'officeframe10back': {
        project: 'pants.html',
        buttonBottom: '35%',
        buttonLeft: '43%'
      },
      'officeframe11back': {
        project: 'data-&-swe-projects.html',
        buttonBottom: '25%'
      },
      'officeframe12back': {
        project: 'chihiro.html',
        code: 'https://github.com/thefarmerbob/chihiro.git',
        buttonBottom: '21%'
      }
    };

    function getButtonsForBack(backSrc) {
      for (const key in frameButtons) {
        if (backSrc.includes(key)) return frameButtons[key];
      }
      return null;
    }

    function openZoom(item) {
      if (zoomedIn) return;
      zoomedIn = true;
      clearTimeout(flipTimer);

      const rect     = item.getBoundingClientRect();
      const frontSrc = item.querySelector('.flip-front img').src;
      const backSrc  = item.querySelector('.flip-back img').src;

      const buttons = getButtonsForBack(backSrc);
      let buttonsHTML = '';
      if (buttons) {
        const btnBottom = buttons.buttonBottom || '21%';
        const btnLeft = buttons.buttonLeft ? ';left:' + buttons.buttonLeft : '';
        buttonsHTML = '<div class="zoom-buttons" style="bottom:' + btnBottom + btnLeft + '">';
        if (buttons.project) {
          const projTarget = buttons.project.endsWith('.html') ? '' : ' target="_blank" rel="noopener"';
          buttonsHTML += '<a href="' + buttons.project + '"' + projTarget + '><img src="svgs/office/view-project-button.svg" alt="view project" /></a>';
        }
        if (buttons.code) buttonsHTML += '<a href="' + buttons.code + '" target="_blank" rel="noopener"><img src="svgs/office/view-code-button.svg" alt="view code" /></a>';
        buttonsHTML += '</div>';
      }

      // Check for extra content in the flip-back (e.g. contact links)
      const flipBack = item.querySelector('.flip-back');
      const extraContent = flipBack.querySelector('.contact-links');
      const extraHTML = extraContent ? extraContent.outerHTML : '';

      zoomFrame.className = '';
      zoomFrame.innerHTML =
        '<div class="zoom-flip-inner">' +
          '<div class="zoom-face front"><img src="' + frontSrc + '" alt="front" /></div>' +
          '<div class="zoom-face back"><img src="' + backSrc + '" alt="back" />' + extraHTML + buttonsHTML + '</div>' +
        '</div>';

      zoomFrame.style.left   = rect.left   + 'px';
      zoomFrame.style.top    = rect.top    + 'px';
      zoomFrame.style.width  = rect.width  + 'px';
      zoomFrame.style.height = rect.height + 'px';

      zoomOverlay.classList.add('active');
      void zoomFrame.offsetHeight;
      zoomFrame.classList.add('animating');

      const maxW = window.innerWidth * 0.75;
      const maxH = window.innerHeight * 0.80;
      const aspect = rect.width / rect.height;
      let tw, th;
      if (aspect > maxW / maxH) { tw = maxW; th = maxW / aspect; }
      else { th = maxH; tw = maxH * aspect; }

      zoomFrame.style.left   = ((window.innerWidth  - tw) / 2) + 'px';
      zoomFrame.style.top    = ((window.innerHeight - th) / 2) + 'px';
      zoomFrame.style.width  = tw + 'px';
      zoomFrame.style.height = th + 'px';

      flipTimer = setTimeout(() => {
        const inner = zoomFrame.querySelector('.zoom-flip-inner');
        if (!inner) return;
        inner.classList.add('can-flip');
        void inner.offsetHeight;
        inner.classList.add('flipped');
      }, 480);
    }

    function closeZoom() {
      if (!zoomedIn) return;
      zoomedIn = false;
      clearTimeout(flipTimer);
      zoomOverlay.classList.remove('active');
      setTimeout(() => { if (!zoomedIn) zoomFrame.innerHTML = ''; }, 400);
    }

    zoomBackdrop.addEventListener('click', closeZoom);
    zoomFrame.addEventListener('click', (e) => {
      if (e.target.closest('.zoom-buttons') || e.target.closest('.contact-links')) return;
      if (e.target.tagName === 'A') return;
      closeZoom();
    });
    // Prevent contact link clicks from bubbling up and closing zoom
    zoomFrame.addEventListener('mousedown', (e) => {
      if (e.target.closest('.contact-links')) e.stopPropagation();
    });

    window.addEventListener('resize', () => {
      if (!zoomedIn) return;
      const maxW = window.innerWidth * 0.75;
      const maxH = window.innerHeight * 0.80;
      const nat = zoomFrame.querySelector('.zoom-face img');
      if (!nat) return;
      const r = nat.naturalWidth / nat.naturalHeight;
      let tw = maxW, th = tw / r;
      if (th > maxH) { th = maxH; tw = th * r; }
      zoomFrame.style.left   = ((window.innerWidth  - tw) / 2) + 'px';
      zoomFrame.style.top    = ((window.innerHeight - th) / 2) + 'px';
      zoomFrame.style.width  = tw + 'px';
      zoomFrame.style.height = th + 'px';
    });

    /* ============================================================
       CLICK DETECTION
       ============================================================ */
    document.querySelectorAll('.wall-item.flippable').forEach(item => {
      item.addEventListener('click', (e) => {
        if (!zoomedIn) openZoom(item);
      });
    });

    document.getElementById('resume-trigger').addEventListener('click', (e) => {
      if (!zoomedIn) openResume();
    });

    document.getElementById('office-lamp').addEventListener('click', () => {
      document.body.classList.toggle('inverted');
    });


    doorEl.addEventListener('click', () => {
      if (enteringDoor) return;

      if (mode === 'walk') {
        autoWalkToDoor();
      } else if (mode === 'climb') {
        showOpenDoor();
        autoGoToDoor();
      }
    });

    function autoGoToDoor() {
      if (enteringDoor) return;
      enteringDoor = true;

      // Animate climbing down
      const climbSpeed = 18;
      function climbStep() {
        if (hasReachedLadderBottom) {
          // Now enter walk mode and walk to door
          enteringDoor = false;
          enterWalkMode();
          autoWalkToDoor();
          return;
        }
        moveBy(climbSpeed);
        // Update overlay position as wall scrolls
        showOpenDoor();
        requestAnimationFrame(climbStep);
      }
      climbStep();
    }

    function autoWalkToDoor() {
      enteringDoor = true;
      const walkSpeed = 8;
      const fastFrameStep = 40;
      const doorCX = getDoorCenterX();
      const sz = getWalkCharSize();
      const targetX = doorCX + sz.w * 0.3;
      let autoWalkAcc = 0;

      function walkLeftIntoDoor() {
        autoWalkAcc = 0;
        showOpenDoor();
        function step() {
          if (walkX <= targetX) {
            triggerDoorSequence();
            return;
          }
          walkX -= walkSpeed;
          walkXFrac = walkX / window.innerWidth;
          charEl.style.left = walkX + 'px';

          autoWalkAcc += walkSpeed;
          if (autoWalkAcc >= fastFrameStep) {
            advanceWalkLeftFrame();
            autoWalkAcc %= fastFrameStep;
          }
          requestAnimationFrame(step);
        }
        step();
      }

      if (walkX > targetX) {
        // Character is to the right of the door — open door, walk left in
        walkLeftIntoDoor();
      } else {
        // Character is to the left — walk right past the door, then turn around
        const overshootX = targetX + sz.w * 3;
        function walkRightStep() {
          if (walkX >= overshootX) {
            // Reached overshoot — now turn around and walk left into door
            walkLeftIntoDoor();
            return;
          }
          walkX += walkSpeed;
          walkXFrac = walkX / window.innerWidth;
          charEl.style.left = walkX + 'px';

          autoWalkAcc += walkSpeed;
          if (autoWalkAcc >= fastFrameStep) {
            advanceWalkRightFrame();
            autoWalkAcc %= fastFrameStep;
          }
          requestAnimationFrame(walkRightStep);
        }
        walkRightStep();
      }
    }

    /* ============================================================
       HOVER GLOW
       ============================================================ */
    let lastHovered = null;
    document.addEventListener('mousemove', e => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const found = el ? (el.closest('.wall-item.flippable') || el.closest('.wall-item.clickable')) : null;
      if (found !== lastHovered) {
        if (lastHovered) lastHovered.classList.remove('hovered');
        if (found) found.classList.add('hovered');
        lastHovered = found;
      }
      document.body.style.cursor = found ? 'pointer' : '';
    });

    /* ============================================================
       RESUME OVERLAY
       ============================================================ */
    const resumeOverlay = document.getElementById('resume-overlay');
    const resumeEmbed   = document.getElementById('resume-embed');

    function openResume() {
      resumeEmbed.src = 'Mara_Resume.pdf#toolbar=0&navpanes=0&view=FitH';
      resumeOverlay.classList.add('active');
    }
    function closeResume() {
      resumeOverlay.classList.remove('active');
      setTimeout(() => { resumeEmbed.src = ''; }, 500);
    }

    document.getElementById('resume-close').addEventListener('click', closeResume);
    document.getElementById('resume-backdrop').addEventListener('click', closeResume);

    /* ============================================================
       INIT & RESIZE
       ============================================================ */
    window.addEventListener('resize', () => {
      const wasAtBottom = hasReachedLadderBottom || mode === 'walk';

      // Preserve progress ratio across resize
      const oldLayout = computeLayout();
      const oldRange = (oldLayout.endY - oldLayout.startY) + oldLayout.maxWO;
      const t = oldRange > 0 ? totalInput / oldRange : 0;

      recalcAll();

      const newLayout = computeLayout();
      const newRange = (newLayout.endY - newLayout.startY) + newLayout.maxWO;

      // If was at bottom, snap to max; otherwise preserve ratio
      totalInput = wasAtBottom ? newRange : t * newRange;

      if (mode === 'walk') {
        const sz = getWalkCharSize();
        charEl.style.width = sz.w + 'px';
        charEl.style.height = sz.h + 'px';
        // Recalculate walkX from stored fraction
        walkX = walkXFrac * window.innerWidth;
        charEl.style.left = walkX + 'px';
      }
      applyFromInput();
    });

    // Recalc once ladder/standing sprite loads
    if (ladderImg) {
      ladderImg.addEventListener('load', () => { recalcAll(); applyFromInput(); });
    }
    charFrame1.addEventListener('load', () => { recalcAll(); applyFromInput(); });

    recalcAll();
    applyFromInput();

    // Iris spiral transition for same-tab project links
    const irisCanvas = document.getElementById('iris-overlay');
    const irisCtx = irisCanvas.getContext('2d');

    function irisTransitionFromPoint(cx, cy, url) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      irisCanvas.width = w;
      irisCanvas.height = h;
      irisCanvas.style.opacity = '1';

      const maxR = Math.sqrt(Math.max(
        cx * cx + cy * cy,
        (w - cx) * (w - cx) + cy * cy,
        cx * cx + (h - cy) * (h - cy),
        (w - cx) * (w - cx) + (h - cy) * (h - cy)
      ));

      const duration = 1000;
      const start = performance.now();

      function draw(now) {
        const t = Math.min((now - start) / duration, 1);
        const ease = t * t;
        const r = maxR * (1 - ease);
        const rotation = t * Math.PI * 6;

        irisCtx.clearRect(0, 0, w, h);
        irisCtx.fillStyle = '#ffffff';
        irisCtx.beginPath();
        irisCtx.rect(0, 0, w, h);
        irisCtx.arc(cx, cy, Math.max(r, 0), 0, Math.PI * 2, true);
        irisCtx.fill('evenodd');

        irisCtx.strokeStyle = '#000000';
        irisCtx.lineWidth = 5;
        const steps = 300;
        const totalAngle = Math.PI * 20;
        irisCtx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const frac = i / steps;
          const spiralR = Math.max(r, 0) + frac * (maxR * 1.3);
          const angle = rotation + frac * totalAngle;
          const x = cx + Math.cos(angle) * spiralR;
          const y = cy + Math.sin(angle) * spiralR;
          if (i === 0) irisCtx.moveTo(x, y);
          else irisCtx.lineTo(x, y);
        }
        irisCtx.stroke();

        irisCtx.strokeStyle = '#000000';
        irisCtx.lineWidth = 4;
        irisCtx.beginPath();
        irisCtx.arc(cx, cy, Math.max(r, 0), 0, Math.PI * 2);
        irisCtx.stroke();

        if (t < 0.99) requestAnimationFrame(draw);
        else window.location.href = url;
      }
      requestAnimationFrame(draw);
    }

    function irisTransition(anchorEl, url) {
      const rect = anchorEl.getBoundingClientRect();
      irisTransitionFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2, url);
    }

    // Reset iris canvas when navigating back (bfcache restore)
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        irisCanvas.style.opacity = '0';
        irisCtx.clearRect(0, 0, irisCanvas.width, irisCanvas.height);
      }
    });

    // Loading screen — dismiss once critical above-fold images are ready
    (function(){
      var screen = document.getElementById('loading-screen');
      var criticalSrcs = [
        'svgs/office/ABOUT.svg',
        'svgs/office/officeframe1.svg',
        'svgs/office/desk.svg'
      ];
      var remaining = criticalSrcs.length;
      function onLoad() {
        remaining--;
        if (remaining > 0) return;
        screen.classList.add('done');
        setTimeout(function(){ screen.remove(); }, 450);
      }
      criticalSrcs.forEach(function(src) {
        var img = new Image();
        img.onload = img.onerror = onLoad;
        img.src = src;
      });
      // Safety fallback
      setTimeout(function(){
        if (screen.parentNode) { screen.classList.add('done'); setTimeout(function(){ screen.remove(); }, 450); }
      }, 4000);
    })();

    // Prefetch chihiro, jars and pants assets in the background
    // (gallery was already cached by home.html's prefetch)
    (function(){
      const assets=[
        // Chihiro
        'svgs/chihiro/bookmark1-white.svg','svgs/chihiro/bookmark1-yellow.svg',
        'svgs/chihiro/bookmark2-white.svg','svgs/chihiro/bookmark2-yellow.svg',
        'svgs/chihiro/bookmark3-white.svg','svgs/chihiro/bookmark3-yellow.svg',
        'svgs/chihiro/button.svg','svgs/chihiro/click-button-text.svg',
        'svgs/chihiro/click-to-learn-more-text.svg','svgs/chihiro/journal-cover.jpeg',
        'svgs/misc/chihiro_text.svg','svgs/misc/disk.svg',
        // Data & SWE projects (jars)
        'svgs/data-and-swe-projects/shelf.svg',
        'svgs/data-and-swe-projects/back-text.svg',
        'svgs/data-and-swe-projects/click-jar-to-open-project-text-outline.svg',
        'svgs/data-and-swe-projects/jar1.svg','svgs/data-and-swe-projects/jar1-text.svg',
        'svgs/data-and-swe-projects/jar2.svg','svgs/data-and-swe-projects/jar2-text.svg',
        'svgs/data-and-swe-projects/jar4.svg','svgs/data-and-swe-projects/jar4-text.svg',
        'svgs/data-and-swe-projects/jar5.svg','svgs/data-and-swe-projects/jar5-text.svg',
        'svgs/data-and-swe-projects/jar5-1.svg','svgs/data-and-swe-projects/jar5-text-1.svg',
        'svgs/data-and-swe-projects/jar6.svg','svgs/data-and-swe-projects/jar6-text.svg',
        'svgs/data-and-swe-projects/jar7.svg','svgs/data-and-swe-projects/jar7-text.svg',
        // Pants
        'svgs/misc/pants.svg','svgs/misc/are-your-pants-cool-text.svg',
        'svgs/misc/click-to-learn-more-text-pants.svg','svgs/misc/journalpaper1.jpeg',
        // Music
        'svgs/character/person_music1.svg','svgs/character/person_music2.svg',
      ];
      let idx=0;
      function fetchNext(){
        if(idx>=assets.length)return;
        fetch(assets[idx],{priority:'low'}).catch(()=>{}).finally(()=>{idx++;fetchNext();});
      }
      setTimeout(fetchNext,2000);
    })();

    // Intercept view-project clicks that go to .html pages
    document.addEventListener('click', (e) => {
      const anchor = e.target.closest('a[href$=".html"]');
      if (anchor && !anchor.target) {
        e.preventDefault();
        irisTransition(anchor, anchor.href);
      }
    });
  </script>
