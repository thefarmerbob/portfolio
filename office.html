<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mara Buşirku — Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #8ba87a;
    }

    /* ====== SCROLL DRIVER ====== */
    #scroll-driver {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow-y: scroll; z-index: 10;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    #scroll-driver::-webkit-scrollbar { display: none; }
    #scroll-content { width: 100%; height: 8000px; }

    /* ====== SCENE & WALL ====== */
    #scene {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
      overflow: visible;
    }
    #wall {
      position: absolute; top: 0; left: 0;
      width: 100%; will-change: transform;
    }
    .wall-item { position: absolute; }
    .wall-item img { display: block; width: 100%; height: auto; }

    .wall-item.clickable,
    .wall-item.flippable {
      pointer-events: auto; cursor: pointer;
      transition: filter 0.35s ease, transform 0.35s ease;
    }
    .wall-item.clickable.hovered,
    .wall-item.flippable.hovered {
      filter: drop-shadow(0 0 12px rgba(58, 107, 39, 0.45));
      transform: scale(1.015);
    }

    .flip-container { position: relative; width: 100%; }
    .flip-front { position: relative; }
    .flip-front img { display: block; width: 100%; height: auto; }
    .flip-back { display: none; }

    /* ====== ZOOM OVERLAY ====== */
    #zoom-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      pointer-events: none; opacity: 0;
      transition: opacity 0.35s ease;
    }
    #zoom-overlay.active { pointer-events: auto; opacity: 1; }

    #zoom-backdrop {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #zoom-frame {
      position: absolute;
      perspective: 1200px;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.5));
      cursor: pointer;
    }
    #zoom-frame.animating {
      transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .zoom-flip-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }
    .zoom-flip-inner.can-flip {
      transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .zoom-flip-inner.flipped {
      transform: rotateY(180deg);
    }
    .zoom-face {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .zoom-face img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }
    .zoom-face.back {
      transform: rotateY(180deg);
    }

    /* ====== RESUME OVERLAY (IMPROVED) ====== */
    #resume-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0;
      transition: opacity 0.4s ease;
    }
    #resume-overlay.active { pointer-events: auto; opacity: 1; }

    #resume-backdrop {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #resume-wrapper {
      position: relative;
      z-index: 101;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: scale(0.92) translateY(12px);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    #resume-overlay.active #resume-wrapper {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    #resume-top-bar {
      width: min(62vh, 85vw);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    #resume-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #resume-close:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: scale(1.08);
    }

    #resume-popup {
      width: min(62vh, 85vw);
      height: min(82vh, 115vw);
      background: white;
      border-radius: 10px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45),
                  0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    #resume-popup embed {
      width: 100%; height: 100%; display: block;
    }

    #resume-bottom-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #resume-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 500;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #resume-download:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: translateY(-1px);
    }
    #resume-download svg {
      width: 14px; height: 14px;
      fill: currentColor;
    }

    /* ====== LADDER & CHARACTER ====== */
    #ladder-wrap {
      position: absolute; right: 4vw; top: -8vw;
      width: 14vw; will-change: transform;
    }
    .ladder-spacer { height: 20vw; }
    #ladder-wrap img.ladder-img { display: block; width: 70%; height: auto; }

    /* ====== FLOOR (scrolls with wall, positioned by JS at ladder bottom) ====== */
    #wall-floor-line {
      position: absolute;
      left: 0; width: 100%;
      height: 4px;
      background: #000;
      pointer-events: none;
      z-index: 10;
    }
    #wall-floor {
      position: absolute;
      left: 0; width: 100%;
      height: 500px;
      background: #ffffff;
      pointer-events: none;
      z-index: 9;
    }

    /* ====== DOOR (scrolls with wall) ====== */
    #wall-door {
      position: absolute;
      left: 8vw;
      width: 16vw;
      z-index: 11;
      cursor: pointer;
      pointer-events: auto;
    }
    #wall-door img {
      position: absolute;
      left: 0;
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }
    #wall-door #door1 { bottom: -1.5vw; }
    #wall-door #door2-p2 { bottom: -0.5vw; left: 6vw; width: 93.5%; height: 93.5%; }

    /* Door front panel overlay — fixed, above character */
    #door-front-overlay {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      display: none;
    }
    #door-front-overlay img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }

    /* ====== CHARACTER ====== */
    #character {
      position: fixed; right: 5vw;
      width: 18vw; z-index: 5;
      will-change: top;
    }
    #character .climb-frame {
      position: absolute; top: 0; left: 25%;
      width: 55%; height: auto;
      transition: opacity 0.05s ease;
    }
    #character #frameStand {
      width: 32%;
      left: -20%;
      top: 5vw;
    }
    #character .climb-frame.hidden { opacity: 0; }
    #character .climb-frame.visible { opacity: 1; }

    /* Walk sprites (gallery-style sizing) */
    #character .walk-frame {
      position: absolute;
      top: -100%; left: 0;
      width: 250%; height: 250%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.05s ease;
    }
    #character .walk-frame.visible { opacity: 1; }

    /* Walk mode overrides */
    #character.walking {
      right: auto;
      top: auto !important;
      bottom: 10%;
    }
    #character.walking .climb-frame { display: none; }

    #vignette {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.12) 100%);
    }
  </style>
</head>

  <script>
    /* ============================================================
       SCROLL, WALL & LADDER
       ============================================================ */
    const scrollDriver = document.getElementById('scroll-driver');
    const wall         = document.getElementById('wall');
    const ladderWrap   = document.getElementById('ladder-wrap');
    const charEl       = document.getElementById('character');
    const wallFloorLine = document.getElementById('wall-floor-line');
    const wallFloor     = document.getElementById('wall-floor');
    const charFrame1   = document.getElementById('frame1');
    const charFrame2   = document.getElementById('frame2');
    const charFrameStand = document.getElementById('frameStand');
    const ladderImg    = document.querySelector('.ladder-img');

    /* ============================================================
       CHARACTER CLIMBING SYSTEM — LINEAR PROGRESS
       ============================================================ */
    const CHAR_START_TOP_FRAC = 0.12;
    const FRAME_STEP = 140;

    let totalInput = 0;        // accumulated scroll input (0 … totalRange)
    let characterScreenY = 0;
    let wallOffset = 0;
    let maxWallOffset = 0;
    let accumulatedDelta = 0;
    let currentFrame = 1;
    let isStanding = false;
    let hasReachedLadderBottom = false;

    /* --- Ladder geometry (recomputed on load/resize) --- */
    function getLadderBottomInWallSpace() {
      const vw = window.innerWidth / 100;
      const ladderStartY = 12 * vw;             // -8vw top + 20vw spacer
      const ladderRenderedW = 14 * 0.7 * vw;    // 9.8vw
      let ladderH;
      if (ladderImg && ladderImg.naturalWidth > 0) {
        ladderH = (ladderImg.naturalHeight / ladderImg.naturalWidth) * ladderRenderedW;
      } else {
        ladderH = 40 * vw;
      }
      return ladderStartY + ladderH;
    }

    /* --- Standing sprite feet offset from character top --- */
    function getStandFeetOffset() {
      const vw = window.innerWidth / 100;
      const spriteW = 0.32 * 18 * vw;
      let spriteH;
      if (charFrameStand.naturalWidth > 0) {
        spriteH = (charFrameStand.naturalHeight / charFrameStand.naturalWidth) * spriteW;
      } else {
        spriteH = spriteW * 2.5;
      }
      return 5 * vw + spriteH;  // top:5vw + sprite height
    }

    /* --- Compute layout: start/end Y for character + maxWallOffset --- */
    function computeLayout() {
      const vw = window.innerWidth / 100;
      const vh = window.innerHeight;
      const ladderBottom = getLadderBottomInWallSpace();
      const feetOffset = getStandFeetOffset();
      const startY = vh * CHAR_START_TOP_FRAC;

      // We need enough wall scroll to show all content
      const contentBottom = 135 * vw;  // approx lowest wall item
      const contentWO = Math.max(0, contentBottom - vh);

      // At end: ladder bottom on screen should be above the floor (floor = bottom 8%)
      // ladderBottom - maxWO should land at ~vh * 0.95 so ladder overlaps the floor
      const maxWO = Math.max(contentWO, ladderBottom - vh * 0.95);
      const endY = Math.max(startY, ladderBottom - feetOffset - maxWO);

      return { startY, endY, maxWO, ladderBottom, contentBottom };
    }

    function recalcAll() {
      const layout = computeLayout();
      maxWallOffset = layout.maxWO;
      document.getElementById('scroll-content').style.height =
        (maxWallOffset + window.innerHeight) + 'px';

      // Position floor at bottom of all wall content
      // When fully scrolled (wallOffset = maxWO), floor screen Y = floorTop - maxWO
      // We want that to be at ~vh * 0.92 (8% from bottom)
      const vh = window.innerHeight;
      const floorTop = layout.maxWO + vh * 0.92;
      wallFloorLine.style.top = floorTop + 'px';
      wallFloor.style.top = (floorTop + 4) + 'px';

      // Position door above the floor line
      const doorH = vh * 0.5;
      doorEl.style.height = doorH + 'px';
      doorEl.style.top = (floorTop - doorH) + 'px';
    }

    function applyFromInput() {
      const { startY, endY, maxWO } = computeLayout();
      const charRange = endY - startY;
      const totalRange = charRange + maxWO;
      totalInput = Math.max(0, Math.min(totalRange, totalInput));

      const t = totalRange > 0 ? totalInput / totalRange : 0;
      characterScreenY = startY + charRange * t;
      wallOffset = maxWO * t;

      wall.style.transform       = `translateY(${-wallOffset}px)`;
      ladderWrap.style.transform = `translateY(${-wallOffset}px)`;
      charEl.style.top           = characterScreenY + 'px';

      // Check if at bottom
      if (t >= 0.999) {
        if (!hasReachedLadderBottom) {
          hasReachedLadderBottom = true;
          showStanding();
        }
      } else {
        if (hasReachedLadderBottom) {
          hasReachedLadderBottom = false;
          hideStanding();
        }
      }
    }

    /* --- Standing sprite management --- */
    function showStanding() {
      if (isStanding) return;
      isStanding = true;
      charFrame1.className = 'climb-frame hidden';
      charFrame2.className = 'climb-frame hidden';
      charFrameStand.className = 'climb-frame visible';
    }

    function hideStanding() {
      if (!isStanding) return;
      isStanding = false;
      charFrameStand.className = 'climb-frame hidden';
      charFrame1.className = 'climb-frame ' + (currentFrame === 1 ? 'visible' : 'hidden');
      charFrame2.className = 'climb-frame ' + (currentFrame === 2 ? 'visible' : 'hidden');
    }

    function advanceClimbFrame() {
      if (isStanding) return;
      const show1 = currentFrame !== 1;
      charFrame1.className = 'climb-frame ' + (show1 ? 'visible' : 'hidden');
      charFrame2.className = 'climb-frame ' + (show1 ? 'hidden'  : 'visible');
      currentFrame = show1 ? 1 : 2;
    }

    /* ============================================================
       MOVE FUNCTION — LINEAR PROGRESS
       ============================================================ */
    function moveBy(delta) {
      if (Math.abs(delta) < 0.5) return;

      if (mode === 'walk') {
        walkMoveBy(delta);
        return;
      }

      // At bottom and scrolling down — enter walk mode
      if (hasReachedLadderBottom && delta > 0) {
        enterWalkMode();
        return;
      }

      totalInput += delta;
      applyFromInput();

      // Animate climbing frames
      if (!hasReachedLadderBottom) {
        accumulatedDelta += Math.abs(delta);
        if (accumulatedDelta >= FRAME_STEP) {
          advanceClimbFrame();
          accumulatedDelta %= FRAME_STEP;
        }
      }
    }

    /* ============================================================
       WALK MODE — after reaching ladder bottom
       ============================================================ */
    const walkLeftFrames = [
      document.getElementById('walkL1'),
      document.getElementById('walkL2'),
      document.getElementById('walkL3'),
      document.getElementById('walkL4'),
    ];
    const idleLeftEl = document.getElementById('idleLeft');
    const allWalkFrames = [...walkLeftFrames, idleLeftEl];
    const doorEl   = document.getElementById('wall-door');
    const door1Img = document.getElementById('door1');
    const door2P2  = document.getElementById('door2-p2');
    const doorFrontOverlay = document.getElementById('door-front-overlay');

    let mode = 'climb';  // 'climb' or 'walk'
    let enteringDoor = false;  // true when character is walking into door
    let walkX = 0;       // character left position in walk mode (pixels)
    let walkXFrac = 0;   // walkX as fraction of viewport width (for resize)
    let walkFrameIndex = 0;
    let walkIdleTimeout = null;
    const WALK_FRAME_STEP = 80;
    const WALK_IDLE_DELAY = 250;
    let walkAccDelta = 0;

    function getWalkCharSize() {
      const s = Math.min(window.innerWidth, window.innerHeight) / 1045;
      return { w: 80 * s, h: 130 * s };
    }

    function getLadderLeftX() {
      // Ladder is at right: 4vw, width: 14vw → left edge is at (100 - 4 - 14)vw = 82vw
      return window.innerWidth * 0.82;
    }

    function enterWalkMode() {
      mode = 'walk';
      const sz = getWalkCharSize();
      // Position character just to the left of the ladder
      walkX = getLadderLeftX() - sz.w;

      walkXFrac = walkX / window.innerWidth;

      charEl.classList.add('walking');
      charEl.style.width = sz.w + 'px';
      charEl.style.height = sz.h + 'px';
      charEl.style.left = walkX + 'px';
      charEl.style.top = '';

      // Hide climb frames, show idle left
      charFrame1.className = 'climb-frame hidden';
      charFrame2.className = 'climb-frame hidden';
      charFrameStand.className = 'climb-frame hidden';
      showWalkFrame(idleLeftEl);
    }

    function exitWalkMode() {
      mode = 'climb';
      charEl.classList.remove('walking');
      charEl.style.width = '18vw';
      charEl.style.height = '';
      charEl.style.left = '';
      walkAccDelta = 0;
      clearTimeout(walkIdleTimeout);

      // Hide walk frames
      allWalkFrames.forEach(f => f.classList.remove('visible'));

      // Restore standing
      showStanding();
      hasReachedLadderBottom = true;
    }

    function showWalkFrame(frameEl) {
      allWalkFrames.forEach(f => f.classList.remove('visible'));
      frameEl.classList.add('visible');
    }

    function showWalkIdle() {
      showWalkFrame(idleLeftEl);
    }

    function advanceWalkLeftFrame() {
      walkFrameIndex = (walkFrameIndex + 1) % 4;
      showWalkFrame(walkLeftFrames[walkFrameIndex]);
      clearTimeout(walkIdleTimeout);
      walkIdleTimeout = setTimeout(showWalkIdle, WALK_IDLE_DELAY);
    }

    function getDoorCenterX() {
      const vw = window.innerWidth / 100;
      return 8 * vw + doorEl.offsetWidth * 0.5;
    }

    function showOpenDoor() {
      door1Img.style.display = 'none';
      door2P2.style.display = 'block';

      // Position front overlay to match door's screen position
      const rect = doorEl.getBoundingClientRect();
      const vw = window.innerWidth / 100;
      doorFrontOverlay.style.left = (rect.left - 0.4 * vw) + 'px';
      doorFrontOverlay.style.top = (rect.top - 0.1 * vw) + 'px';
      doorFrontOverlay.style.width = (rect.width * 1.086) + 'px';
      doorFrontOverlay.style.height = (rect.height * 1.086) + 'px';
      doorFrontOverlay.style.display = 'block';
    }

    function hideOpenDoor() {
      door2P2.style.display = 'none';
      doorFrontOverlay.style.display = 'none';
      door1Img.style.display = 'block';
    }

    function triggerDoorSequence() {
      // Ensure open door is shown
      showOpenDoor();

      // Animate character walking to door center and fading
      const doorCX = getDoorCenterX();
      const sz = getWalkCharSize();
      const targetX = doorCX;

      charEl.style.transition = 'left 0.15s ease-in, opacity 0.1s ease-in 0.05s';
      charEl.style.left = targetX + 'px';
      charEl.style.opacity = '0';

      // After character disappears, close door and redirect
      setTimeout(() => {
        hideOpenDoor();
        setTimeout(() => {
          window.location.href = 'gallery.html';
        }, 150);
      }, 200);
    }

    function walkMoveBy(delta) {
      if (enteringDoor) return;

      // delta > 0 means scroll down = walk left
      if (delta > 0) {
        walkX = Math.max(-getWalkCharSize().w, walkX - delta);
        walkXFrac = walkX / window.innerWidth;
        charEl.style.left = walkX + 'px';

        walkAccDelta += Math.abs(delta);
        if (walkAccDelta >= WALK_FRAME_STEP) {
          advanceWalkLeftFrame();
          walkAccDelta %= WALK_FRAME_STEP;
        }

        // Check if character reached the door
        const sz = getWalkCharSize();
        const doorCX = getDoorCenterX();
        if (walkX + sz.w / 2 <= doorCX + sz.w * 0.3) {
          triggerDoorSequence();
        }
      } else {
        // Scrolling up = walk right, back toward ladder
        const sz = getWalkCharSize();
        const maxX = getLadderLeftX() - sz.w;
        walkX = Math.min(maxX, walkX - delta);
        if (walkX >= maxX) {
          walkX = maxX;
          exitWalkMode();
          return;
        }
        walkXFrac = walkX / window.innerWidth;
        charEl.style.left = walkX + 'px';

        walkAccDelta += Math.abs(delta);
        if (walkAccDelta >= WALK_FRAME_STEP) {
          advanceWalkLeftFrame();
          walkAccDelta %= WALK_FRAME_STEP;
        }
      }
    }

    /* ============================================================
       INPUT: Wheel / Touch / Keyboard
       ============================================================ */
    scrollDriver.style.pointerEvents = 'none';
    scrollDriver.style.overflow = 'hidden';

    const SCROLL_TO_MOVE = 0.8;

    document.addEventListener('wheel', (e) => {
      if (zoomedIn || resumeOverlay.classList.contains('active')) return;
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      moveBy(delta * SCROLL_TO_MOVE);
    }, { passive: false });

    let touchLastY = 0;
    document.addEventListener('touchstart', (e) => {
      if (!zoomedIn && !resumeOverlay.classList.contains('active')) {
        touchLastY = e.touches[0].clientY;
      }
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (zoomedIn || resumeOverlay.classList.contains('active')) return;
      const touchY = e.touches[0].clientY;
      moveBy((touchLastY - touchY) * 0.8);
      touchLastY = touchY;
    }, { passive: false });

    let keysHeld = { up: false, down: false };
    let keyAnimFrame = null;
    const KEY_SPEED = 8;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (zoomedIn) closeZoom();
        else if (resumeOverlay.classList.contains('active')) closeResume();
        return;
      }
      if (zoomedIn || resumeOverlay.classList.contains('active')) return;
      if (e.key === 'ArrowDown' || e.key === 's') { keysHeld.down = true; e.preventDefault(); }
      if (e.key === 'ArrowUp' || e.key === 'w') { keysHeld.up = true; e.preventDefault(); }
      startKeyLoop();
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowDown' || e.key === 's') keysHeld.down = false;
      if (e.key === 'ArrowUp' || e.key === 'w') keysHeld.up = false;
    });
    function startKeyLoop() { if (!keyAnimFrame) keyLoop(); }
    function keyLoop() {
      let delta = 0;
      if (keysHeld.down) delta += KEY_SPEED;
      if (keysHeld.up) delta -= KEY_SPEED;
      if (delta !== 0) { moveBy(delta); keyAnimFrame = requestAnimationFrame(keyLoop); }
      else keyAnimFrame = null;
    }

    /* ============================================================
       FLIP CONTAINER HEIGHT
       ============================================================ */
    document.querySelectorAll('.wall-item.flippable').forEach(item => {
      const img = item.querySelector('.flip-front img');
      const ct  = item.querySelector('.flip-container');
      const fn  = () => { if (img.naturalHeight) ct.style.height = (item.offsetWidth * img.naturalHeight / img.naturalWidth) + 'px'; };
      img.addEventListener('load', fn);
      window.addEventListener('resize', fn);
      if (img.complete) fn();
    });

    /* ============================================================
       ZOOM + FLIP OVERLAY
       ============================================================ */
    const zoomOverlay  = document.getElementById('zoom-overlay');
    const zoomBackdrop = document.getElementById('zoom-backdrop');
    const zoomFrame    = document.getElementById('zoom-frame');

    let zoomedIn = false;
    let flipTimer = null;

    function openZoom(item) {
      if (zoomedIn) return;
      zoomedIn = true;
      clearTimeout(flipTimer);

      const rect     = item.getBoundingClientRect();
      const frontSrc = item.querySelector('.flip-front img').src;
      const backSrc  = item.querySelector('.flip-back img').src;

      zoomFrame.className = '';
      zoomFrame.innerHTML =
        '<div class="zoom-flip-inner">' +
          '<div class="zoom-face front"><img src="' + frontSrc + '" alt="front" /></div>' +
          '<div class="zoom-face back"><img src="' + backSrc + '" alt="back" /></div>' +
        '</div>';

      zoomFrame.style.left   = rect.left   + 'px';
      zoomFrame.style.top    = rect.top    + 'px';
      zoomFrame.style.width  = rect.width  + 'px';
      zoomFrame.style.height = rect.height + 'px';

      zoomOverlay.classList.add('active');
      void zoomFrame.offsetHeight;
      zoomFrame.classList.add('animating');

      const maxW = window.innerWidth * 0.75;
      const maxH = window.innerHeight * 0.80;
      const aspect = rect.width / rect.height;
      let tw, th;
      if (aspect > maxW / maxH) { tw = maxW; th = maxW / aspect; }
      else { th = maxH; tw = maxH * aspect; }

      zoomFrame.style.left   = ((window.innerWidth  - tw) / 2) + 'px';
      zoomFrame.style.top    = ((window.innerHeight - th) / 2) + 'px';
      zoomFrame.style.width  = tw + 'px';
      zoomFrame.style.height = th + 'px';

      flipTimer = setTimeout(() => {
        const inner = zoomFrame.querySelector('.zoom-flip-inner');
        if (!inner) return;
        inner.classList.add('can-flip');
        void inner.offsetHeight;
        inner.classList.add('flipped');
      }, 480);
    }

    function closeZoom() {
      if (!zoomedIn) return;
      zoomedIn = false;
      clearTimeout(flipTimer);
      zoomOverlay.classList.remove('active');
    }

    zoomBackdrop.addEventListener('click', closeZoom);
    zoomFrame.addEventListener('click', closeZoom);

    /* ============================================================
       CLICK DETECTION
       ============================================================ */
    document.querySelectorAll('.wall-item.flippable').forEach(item => {
      item.addEventListener('click', (e) => {
        if (!zoomedIn) openZoom(item);
      });
    });

    document.getElementById('resume-trigger').addEventListener('click', (e) => {
      if (!zoomedIn) openResume();
    });

    doorEl.addEventListener('click', () => {
      if (enteringDoor) return;
      // Open door immediately on click
      showOpenDoor();

      if (mode === 'walk') {
        autoWalkToDoor();
      } else if (mode === 'climb') {
        autoGoToDoor();
      }
    });

    function autoGoToDoor() {
      if (enteringDoor) return;
      enteringDoor = true;

      // Animate climbing down
      const climbSpeed = 18;
      function climbStep() {
        if (hasReachedLadderBottom) {
          // Now enter walk mode and walk to door
          enteringDoor = false;
          enterWalkMode();
          autoWalkToDoor();
          return;
        }
        moveBy(climbSpeed);
        // Update overlay position as wall scrolls
        showOpenDoor();
        requestAnimationFrame(climbStep);
      }
      climbStep();
    }

    function autoWalkToDoor() {
      enteringDoor = true;
      const walkSpeed = 8;
      const fastFrameStep = 40;  // faster frame cycling
      const doorCX = getDoorCenterX();
      const sz = getWalkCharSize();
      const targetX = doorCX + sz.w * 0.3;
      let autoWalkAcc = 0;

      function walkStep() {
        if (walkX <= targetX) {
          triggerDoorSequence();
          return;
        }
        walkX -= walkSpeed;
        walkXFrac = walkX / window.innerWidth;
        charEl.style.left = walkX + 'px';

        autoWalkAcc += walkSpeed;
        if (autoWalkAcc >= fastFrameStep) {
          advanceWalkLeftFrame();
          autoWalkAcc %= fastFrameStep;
        }
        requestAnimationFrame(walkStep);
      }
      walkStep();
    }

    /* ============================================================
       HOVER GLOW
       ============================================================ */
    let lastHovered = null;
    document.addEventListener('mousemove', e => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const found = el ? (el.closest('.wall-item.flippable') || el.closest('.wall-item.clickable')) : null;
      if (found !== lastHovered) {
        if (lastHovered) lastHovered.classList.remove('hovered');
        if (found) found.classList.add('hovered');
        lastHovered = found;
      }
      document.body.style.cursor = found ? 'pointer' : '';
    });

    /* ============================================================
       RESUME OVERLAY
       ============================================================ */
    const resumeOverlay = document.getElementById('resume-overlay');
    const resumeEmbed   = document.getElementById('resume-embed');

    function openResume() {
      resumeEmbed.src = 'Mara_Resume.pdf#toolbar=0&navpanes=0&view=FitH';
      resumeOverlay.classList.add('active');
    }
    function closeResume() {
      resumeOverlay.classList.remove('active');
      setTimeout(() => { resumeEmbed.src = ''; }, 500);
    }

    document.getElementById('resume-close').addEventListener('click', closeResume);
    document.getElementById('resume-backdrop').addEventListener('click', closeResume);

    /* ============================================================
       INIT & RESIZE
       ============================================================ */
    window.addEventListener('resize', () => {
      const wasAtBottom = hasReachedLadderBottom || mode === 'walk';

      // Preserve progress ratio across resize
      const oldLayout = computeLayout();
      const oldRange = (oldLayout.endY - oldLayout.startY) + oldLayout.maxWO;
      const t = oldRange > 0 ? totalInput / oldRange : 0;

      recalcAll();

      const newLayout = computeLayout();
      const newRange = (newLayout.endY - newLayout.startY) + newLayout.maxWO;

      // If was at bottom, snap to max; otherwise preserve ratio
      totalInput = wasAtBottom ? newRange : t * newRange;

      if (mode === 'walk') {
        const sz = getWalkCharSize();
        charEl.style.width = sz.w + 'px';
        charEl.style.height = sz.h + 'px';
        // Recalculate walkX from stored fraction
        walkX = walkXFrac * window.innerWidth;
        charEl.style.left = walkX + 'px';
      }
      applyFromInput();
    });

    // Recalc once ladder/standing sprite loads
    if (ladderImg) {
      ladderImg.addEventListener('load', () => { recalcAll(); applyFromInput(); });
    }
    charFrameStand.addEventListener('load', () => { recalcAll(); applyFromInput(); });

    recalcAll();
    applyFromInput();
  </script>
</body>
</html>
