<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mara Buşirku — Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #8ba87a;
    }

    /* ====== SCROLL DRIVER ====== */
    #scroll-driver {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow-y: scroll; z-index: 10;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    #scroll-driver::-webkit-scrollbar { display: none; }
    #scroll-content { width: 100%; height: 8000px; }

    /* ====== SCENE & WALL ====== */
    #scene {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }
    #wall {
      position: absolute; top: 0; left: 0;
      width: 100%; will-change: transform;
    }
    .wall-item { position: absolute; }
    .wall-item img { display: block; width: 100%; height: auto; }

    .wall-item.clickable,
    .wall-item.flippable {
      pointer-events: auto; cursor: pointer;
      transition: filter 0.35s ease, transform 0.35s ease;
    }
    .wall-item.clickable.hovered,
    .wall-item.flippable.hovered {
      filter: drop-shadow(0 0 12px rgba(58, 107, 39, 0.45));
      transform: scale(1.015);
    }

    .flip-container { position: relative; width: 100%; }
    .flip-front { position: relative; }
    .flip-front img { display: block; width: 100%; height: auto; }
    .flip-back { display: none; }

    /* ====== ZOOM OVERLAY ====== */
    #zoom-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      pointer-events: none; opacity: 0;
      transition: opacity 0.35s ease;
    }
    #zoom-overlay.active { pointer-events: auto; opacity: 1; }

    #zoom-backdrop {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #zoom-frame {
      position: absolute;
      perspective: 1200px;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.5));
      cursor: pointer;
    }
    #zoom-frame.animating {
      transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .zoom-flip-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }
    .zoom-flip-inner.can-flip {
      transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .zoom-flip-inner.flipped {
      transform: rotateY(180deg);
    }
    .zoom-face {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .zoom-face img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }
    .zoom-face.back {
      transform: rotateY(180deg);
    }

    /* ====== RESUME OVERLAY (IMPROVED) ====== */
    #resume-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0;
      transition: opacity 0.4s ease;
    }
    #resume-overlay.active { pointer-events: auto; opacity: 1; }

    #resume-backdrop {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #resume-wrapper {
      position: relative;
      z-index: 101;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: scale(0.92) translateY(12px);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    #resume-overlay.active #resume-wrapper {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* Top bar with close */
    #resume-top-bar {
      width: min(62vh, 85vw);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    #resume-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #resume-close:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: scale(1.08);
    }

    /* The PDF container */
    #resume-popup {
      width: min(62vh, 85vw);
      height: min(82vh, 115vw);
      background: white;
      border-radius: 10px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45),
                  0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    #resume-popup embed {
      width: 100%; height: 100%; display: block;
    }

    /* Bottom action bar */
    #resume-bottom-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #resume-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 500;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #resume-download:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: translateY(-1px);
    }
    #resume-download svg {
      width: 14px; height: 14px;
      fill: currentColor;
    }

    /* ====== LADDER & CHARACTER ====== */
    #ladder-wrap {
      position: absolute; right: 4vw; top: -8vw;
      width: 14vw; will-change: transform;
    }
    .ladder-spacer { height: 20vw; }
    #ladder-wrap img.ladder-img { display: block; width: 70%; height: auto; }

    #character {
      position: fixed; right: 5vw; top: 19%;
      width: 18vw; z-index: 5;
    }
    #character img {
      position: absolute; top: 0; left: 25%;
      width: 55%; height: auto;
      transition: opacity 0.05s ease;
    }
    #character img.hidden { opacity: 0; }
    #character img.visible { opacity: 1; }

    #vignette {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.12) 100%);
    }
  </style>
</head>
<body>

    <div id="ladder-wrap">

  <div id="vignette"></div>

  <!-- Zoom overlay -->
  <div id="zoom-overlay">
    <div id="zoom-backdrop"></div>
    <div id="zoom-frame"></div>
  </div>

  <!-- Resume overlay (IMPROVED) -->
  <div id="resume-overlay">
    <div id="resume-backdrop"></div>
    <div id="resume-wrapper">
      <div id="resume-top-bar">
        <button id="resume-close" aria-label="Close resume">✕</button>
      </div>
      <div id="resume-popup">
        <embed id="resume-embed" src="" type="application/pdf" />
      </div>
      <div id="resume-bottom-bar">
        <a id="resume-download" href="Mara_Resume.pdf" download>
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 12L3 7h3V1h4v6h3L8 12zM2 14v-1h12v1H2z"/>
          </svg>
          Download PDF
        </a>

  <script>
    /* ============================================================
       SCROLL & CHARACTER
       ============================================================ */
    const scrollDriver = document.getElementById('scroll-driver');
    const wall         = document.getElementById('wall');
    const ladderWrap   = document.getElementById('ladder-wrap');
    const charFrame1   = document.getElementById('frame1');
    const charFrame2   = document.getElementById('frame2');

    let lastToggleScroll = 0, currentFrame = 1;

    scrollDriver.addEventListener('scroll', () => {
      const y = scrollDriver.scrollTop;
      wall.style.transform       = `translateY(${-y}px)`;
      ladderWrap.style.transform = `translateY(${-y}px)`;

      if (Math.abs(y - lastToggleScroll) >= 140) {
        lastToggleScroll = y;
        const show1 = currentFrame !== 1;
        charFrame1.className = show1 ? 'visible' : 'hidden';
        charFrame2.className = show1 ? 'hidden'  : 'visible';
        currentFrame = show1 ? 1 : 2;
      }
    });

    const ladderImg = ladderWrap.querySelector('.ladder-img');
    function recalcHeight() {
      const vw = window.innerWidth / 100;
      // Desk is the last element: top=154vw, width=50vw, aspect=537/570
      const deskBottom = (154 + 50 * (537 / 570)) * vw;
      document.getElementById('scroll-content').style.height = (deskBottom + window.innerHeight * 0.15) + 'px';
    }
    window.addEventListener('resize', recalcHeight);
    recalcHeight();

    document.querySelectorAll('.wall-item.flippable').forEach(item => {
      const img = item.querySelector('.flip-front img');
      const ct  = item.querySelector('.flip-container');
      const fn  = () => { if (img.naturalHeight) ct.style.height = (item.offsetWidth * img.naturalHeight / img.naturalWidth) + 'px'; };
      img.addEventListener('load', fn);
      window.addEventListener('resize', fn);
      if (img.complete) fn();
    });

    /* ============================================================
       ZOOM + FLIP OVERLAY
       ============================================================ */
    const zoomOverlay  = document.getElementById('zoom-overlay');
    const zoomBackdrop = document.getElementById('zoom-backdrop');
    const zoomFrame    = document.getElementById('zoom-frame');

    let zoomedIn = false;
    let flipTimer = null;

    function openZoom(item) {
      if (zoomedIn) return;
      zoomedIn = true;
      clearTimeout(flipTimer);

      const rect     = item.getBoundingClientRect();
      const frontSrc = item.querySelector('.flip-front img').src;
      const backSrc  = item.querySelector('.flip-back img').src;

      zoomFrame.className = '';
      zoomFrame.innerHTML =
        '<div class="zoom-flip-inner">' +
          '<div class="zoom-face front"><img src="' + frontSrc + '" alt="front" /></div>' +
          '<div class="zoom-face back"><img src="' + backSrc + '" alt="back" /></div>' +
        '</div>';

      zoomFrame.style.left   = rect.left   + 'px';
      zoomFrame.style.top    = rect.top    + 'px';
      zoomFrame.style.width  = rect.width  + 'px';
      zoomFrame.style.height = rect.height + 'px';

      zoomOverlay.classList.add('active');
      scrollDriver.style.overflow = 'hidden';

      void zoomFrame.offsetHeight;

      zoomFrame.classList.add('animating');

      const maxW = window.innerWidth * 0.75;
      const maxH = window.innerHeight * 0.80;
      const aspect = rect.width / rect.height;
      let tw, th;
      if (aspect > maxW / maxH) { tw = maxW; th = maxW / aspect; }
      else { th = maxH; tw = maxH * aspect; }

      zoomFrame.style.left   = ((window.innerWidth  - tw) / 2) + 'px';
      zoomFrame.style.top    = ((window.innerHeight - th) / 2) + 'px';
      zoomFrame.style.width  = tw + 'px';
      zoomFrame.style.height = th + 'px';

      flipTimer = setTimeout(() => {
        const inner = zoomFrame.querySelector('.zoom-flip-inner');
        if (!inner) return;
        inner.classList.add('can-flip');
        void inner.offsetHeight;
        inner.classList.add('flipped');
      }, 480);
    }

    function closeZoom() {
      if (!zoomedIn) return;
      zoomedIn = false;
      clearTimeout(flipTimer);
      zoomOverlay.classList.remove('active');
      scrollDriver.style.overflow = '';
    }

    zoomBackdrop.addEventListener('click', closeZoom);
    zoomFrame.addEventListener('click', closeZoom);

    /* ============================================================
       CLICK DETECTION
       ============================================================ */
    let downX = 0, downY = 0, downTime = 0;

    scrollDriver.addEventListener('mousedown', e => {
      downX = e.clientX; downY = e.clientY; downTime = Date.now();
    });
    scrollDriver.addEventListener('mouseup', e => {
      if (Math.abs(e.clientX - downX) < 6 && Math.abs(e.clientY - downY) < 6 && Date.now() - downTime < 400)
        handleClick(e.clientX, e.clientY);
    });

    let tX = 0, tY = 0, tTime = 0;
    scrollDriver.addEventListener('touchstart', e => {
      if (e.touches.length === 1) { tX = e.touches[0].clientX; tY = e.touches[0].clientY; tTime = Date.now(); }
    }, { passive: true });
    scrollDriver.addEventListener('touchend', e => {
      if (e.changedTouches.length === 1) {
        const t = e.changedTouches[0];
        if (Math.abs(t.clientX - tX) < 12 && Math.abs(t.clientY - tY) < 12 && Date.now() - tTime < 400)
          handleClick(t.clientX, t.clientY);
      }
    });

    function handleClick(cx, cy) {
      if (zoomedIn) return;
      scrollDriver.style.pointerEvents = 'none';
      const el = document.elementFromPoint(cx, cy);
      scrollDriver.style.pointerEvents = '';
      if (!el) return;

      if (el.closest('#resume-trigger')) { openResume(); return; }
      const flippable = el.closest('.wall-item.flippable');
      if (flippable) openZoom(flippable);
    }

    /* ============================================================
       HOVER GLOW
       ============================================================ */
    let lastHovered = null;
    scrollDriver.addEventListener('mousemove', e => {
      scrollDriver.style.pointerEvents = 'none';
      const el = document.elementFromPoint(e.clientX, e.clientY);
      scrollDriver.style.pointerEvents = '';
      const found = el ? (el.closest('.wall-item.flippable') || el.closest('.wall-item.clickable')) : null;
      if (found !== lastHovered) {
        if (lastHovered) lastHovered.classList.remove('hovered');
        if (found) found.classList.add('hovered');
        lastHovered = found;
      }
      scrollDriver.style.cursor = found ? 'pointer' : '';
    });

    /* ============================================================
       RESUME OVERLAY
       ============================================================ */
    const resumeOverlay = document.getElementById('resume-overlay');
    const resumeEmbed   = document.getElementById('resume-embed');

    function openResume() {
      resumeEmbed.src = 'Mara_Resume.pdf#toolbar=0&navpanes=0&view=FitH';
      resumeOverlay.classList.add('active');
      scrollDriver.style.overflow = 'hidden';
    }
    function closeResume() {
      resumeOverlay.classList.remove('active');
      scrollDriver.style.overflow = '';
      setTimeout(() => { resumeEmbed.src = ''; }, 500);
    }

    document.getElementById('resume-close').addEventListener('click', closeResume);
    document.getElementById('resume-backdrop').addEventListener('click', closeResume);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (zoomedIn) closeZoom();
        else if (resumeOverlay.classList.contains('active')) closeResume();
      }
    });
  </script>
</body>
