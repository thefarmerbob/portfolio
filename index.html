<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Character must appear before anything else -->
  <link rel="preload" href="svgs/character/person_stand.svg" as="image" fetchpriority="high">
  <script>
    (function(){
      var D = 1100;
      function z(){ document.documentElement.style.zoom = window.innerWidth < D ? window.innerWidth/D : 1; }
      z(); window.addEventListener('resize', z);
    })();
  </script>
  <title>loading...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100%; height: 100vh;
      background: #8ba87a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2vw;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    /* ── Spinning character ── */
    #char-wrap {
      width: 7vw;
      min-width: 60px;
      animation: spin 1.8s linear infinite;
      transform-origin: center center;
    }
    #char-wrap img {
      width: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── "loading" label with animated dots ── */
    #loading-label {
      font-size: clamp(12px, 1.1vw, 18px);
      color: #1a2e10;
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }
    #dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    /* ── Progress bar ── */
    #bar-wrap {
      width: clamp(180px, 22vw, 360px);
      height: 3px;
      background: rgba(0,0,0,0.15);
      border-radius: 99px;
      overflow: hidden;
    }
    #bar-fill {
      height: 100%;
      width: 0%;
      background: #1a2e10;
      border-radius: 99px;
      transition: width 0.2s ease;
    }

    /* ── Count label ── */
    #count-label {
      font-size: clamp(9px, 0.7vw, 13px);
      color: rgba(26, 46, 16, 0.55);
      letter-spacing: 0.12em;
    }

    /* ── Fade-out ── */
    body.done {
      transition: opacity 0.55s ease;
      opacity: 0;
    }
  </style>
</head>

    const total     = ASSETS.length;
    const barFill   = document.getElementById('bar-fill');
    const countEl   = document.getElementById('count-label');
    let loaded = 0;

    function tick() {
      loaded++;
      const pct = (loaded / total) * 100;
      barFill.style.width = pct + '%';
      countEl.textContent = loaded + ' / ' + total;

      if (loaded >= total) {
        document.body.classList.add('done');
        document.body.addEventListener('transitionend', () => {
          window.location.replace('home.html');
        }, { once: true });
        // Fallback in case transitionend doesn't fire
        setTimeout(() => window.location.replace('home.html'), 700);
      }
    }

    countEl.textContent = '0 / ' + total;

    // Wait for the character to be visible before flooding bandwidth with bulk requests
    function startPreloading() {
      ASSETS.forEach(src => {
        const img = new Image();
        img.onload = img.onerror = tick;
        img.src = src;
      });
    }

    const charImg = document.getElementById('char-img');
    if (charImg.complete && charImg.naturalWidth > 0) {
      startPreloading();
    } else {
      charImg.addEventListener('load', startPreloading, { once: true });
      charImg.addEventListener('error', startPreloading, { once: true });
    }
